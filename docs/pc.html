   Shift+Enter で前の欄。行の終わりでは次の人の最初の欄へ */
function scKey(e){
  if(e.key!=="Enter"||e.isComposing||e.keyCode===229||e.altKey||e.ctrlKey||e.metaKey) return;
  const t=e.target; if(!t||!t.dataset) return;
  const r=+t.dataset.r, c=+t.dataset.c;
  const at=(rr,cc)=>document.querySelector(`input[data-r="${rr}"][data-c="${cc}"]`);
  const last=rr=>document.querySelectorAll(`input[data-r="${rr}"]`).length-1;
  let nr=r, nc=c+(e.shiftKey?-1:1);
  if(!at(nr,nc)){ if(e.shiftKey){ nr=r-1; nc=last(nr); } else { nr=r+1; nc=0; } }
  e.preventDefault();
  if(t.blur) t.blur();                 /* ここで値が確定し、画面が作り直される */
  const n=at(nr,nc);
  if(n&&n.focus){ n.focus(); if(n.select) n.select(); }
}

      .map(s=>{const m=String(s).match(/\d+(?:\.\d+)?/);return m?+m[0]:null;});
  };
  const net=vals("net"),hc=vals("hc"),tot=vals("tot");
  if(!net||!hc) return [];
  return names.map((raw,i)=>{
    const n=net[i],h=hc[i];
    let g=tot?tot[i]:null;
    /* Total が欠けていても Hdcp＋Net で埋まる */
    if(g===null&&n!==null&&h!==null) g=Math.round((n+h)*10)/10;
    const r=(g!==null&&h!==null&&n!==null)?{g,hc:h,net:n}:null;
    return {raw,g:r?r.g:null,hc:r?r.hc:null,net:r?r.net:null,
      filled:!!(r&&tot&&tot[i]===null)};
  });
}
/* ---- 改行が崩れていても組み直す ----
   写真からの文字認識は、表の改行を正しく返さないことがある。行が1つに繋がったり、
   1行が途中で切れたりすると、行ごとに読む方法では全滅する。
   ただし集計表の数字には強い決まりがあるので、改行を当てにせず並びだけで復元できる。
     前半9の合計 ＝ OUT ／ 後半9の合計 ＝ IN ／ OUT＋IN ＝ Total ／ Total−Hdcp ＝ Net
   この4つが同時に成り立つ23個のかたまりを、文章全体から拾っていく。
   4つ同時に偶然そろうことはまず無いので、誤って拾う心配は小さい。
   PAR行（21個で終わる）やHOLE行（前半9の合計が合わない）は自然に外れる。 */
function sheetStream(text, roster){
  const t=tidy(text).replace(/\r/g,"\n");
  /* 氏名と数字を、出てきた順にそのまま並べる */
  const toks=[];
  const re=/(\d+(?:\.\d+)?)|([^\d\s,、|｜/]+)/g;
  let m;
  while((m=re.exec(t))!==null){
    if(m[1]!==undefined) toks.push({t:"n",v:+m[1]});
    else toks.push({t:"w",v:m[2]});
  }
  const S=(a)=>a.reduce((x,y)=>x+y,0);
  const near=(a,b)=>Math.abs(a-b)<0.6;
  const out=[];
  for(let i=0;i+22<toks.length;i++){
    /* 23個ぶん、数字だけが続いているか */
    let ok=true;
    for(let k=0;k<23;k++) if(toks[i+k].t!=="n"){ok=false;i+=k;break;}
    if(!ok) continue;
    const v=toks.slice(i,i+23).map(x=>x.v);
    const a=v.slice(0,9),o=v[9],b=v.slice(10,19),inn=v[19],tot=v[20],hc=v[21],net=v[22];
    if(!a.every(Number.isInteger)||!b.every(Number.isInteger)) continue;
    if(!a.every(x=>x>=1&&x<=20)||!b.every(x=>x>=1&&x<=20)) continue;
    if(S(a)!==o||S(b)!==inn||o+inn!==tot) continue;
    if(!(tot>=40&&tot<=200&&hc>=0&&hc<=54&&near(tot-hc,net))) continue;
    /* かたまりの手前にある語をつなげて氏名の候補にする（順位や「優勝」は除く） */
    let name="";
    for(let k=i-1;k>=0&&k>=i-4;k--){
      if(toks[k].t!=="n"){ name=toks[k].v+name; } else break;
    }
    out.push({start:i,holes:a.concat(b),out:o,inn,g:tot,hc,net,raw:name});
    i+=22;
  }
  return out;
}
/* ---- 集計表の1行を数字の並びから読む ----
   ゴルフ場の集計表は「氏名／18ホール／OUT／IN／Total／Hdcp／Net」の並びが多い。
   先頭から40〜200の数値をグロスとみなすと、OUTの小計（42など）を拾ってしまう。
   末尾から Total − Hdcp ＝ Net が成り立つ組を探すのが、いちばん確かめやすい。
   （2026年の大会の集計表で、16名全員がOUTを誤って拾う不具合があった） */
function sheetTail(nums){
  for(let i=nums.length-3;i>=0;i--){
    const g=nums[i],hc=nums[i+1],net=nums[i+2];
    if(g>=40&&g<=200&&hc>=0&&hc<=54&&net>=20&&net<=200&&Math.abs(g-hc-net)<0.6)
      return {g,hc,net,at:i,sure:true};
  }
  /* Total・Hdcp・Net が3つそろわない書き方（氏名＋グロス＋ネット等）への逃げ道。
     ただし後ろにネットらしい数値があって計算と合わない行は、
     読み間違いの可能性が高いので採用しない（黙って値を作り直さない） */
  for(let i=nums.length-2;i>=0;i--){
    const g=nums[i],v=nums[i+1],w=nums[i+2];
    if(g<40||g>200) continue;
    if(v>=40&&v<g) return {g,hc:Math.round((g-v)*10)/10,net:v,at:i,sure:false};
    if(v>=0&&v<=54){
      if(w!==undefined&&w>=20&&Math.abs(g-v-w)>=0.6) continue;
      return {g,hc:v,net:Math.round((g-v)*10)/10,at:i,sure:false};
    }
  }
  return null;
}
/* Total の位置から手前をさかのぼり、18ホールぶんのスコアが並んでいれば取り出す。
   OUT＝前半9の合計、IN＝後半9の合計、Total＝OUT＋IN の3つが成り立つことで判定する */
function sheetHoles(nums,at){
  const S=a=>a.reduce((x,y)=>x+y,0), fine=a=>a.every(v=>Number.isInteger(v)&&v>=1&&v<=20);
  if(at>=20){
    const a=nums.slice(at-20,at-11),o=nums[at-11],b=nums.slice(at-10,at-1),i=nums[at-1];
    if(a.length===9&&b.length===9&&fine(a)&&fine(b)&&S(a)===o&&S(b)===i&&o+i===nums[at])
      return {holes:a.concat(b),out:o,inn:i};
  }
  if(at>=18){                       /* OUT・IN が無く、18ホールがそのまま並ぶ場合 */
    const v=nums.slice(at-18,at);
    if(v.length===18&&fine(v)&&S(v)===nums[at])
      return {holes:v,out:S(v.slice(0,9)),inn:S(v.slice(9))};
  }
  return null;
}
/* 読み取った値が成り立っているか。ここを通らない行は取り込ませない */
function sheetWhy(name,r){
  if(!name) return "氏名が読めません";
  if(!r) return "グロスが読めません";
  if(r.hc<0) return "ハンディが負の値になりました（OUTの小計を拾った可能性）";
  if(r.hc>54) return "ハンディが大きすぎます";
  if(r.net>r.g+0.6) return "ネットがグロスを超えています";
  if(r.net<20) return "ネットが小さすぎます";
  return "";
}
/* 復元したかたまりを、行ごとに読んだときと同じ形にそろえる */
function sheetFromStream(text){
  return sheetStream(text).map(s=>{
    const hit=nameHits(s.raw,DB.players)[0];
    const nums=[...s.holes.slice(0,9),s.out,...s.holes.slice(9),s.inn,s.g,s.hc,s.net];
    return {line:(s.raw||"（氏名なし）")+" "+nums.join(" "),
      name:hit?hit.n:"",found:!!hit,g:s.g,hc:s.hc,net:s.net,
      holes:s.holes,out:s.out,inn:s.inn,sure:true,rebuilt:true,
      ok:!!hit,why:hit?"":"氏名が読み取れませんでした（名簿と照合できず）"};
  });
}
/* 縦向きに読まれた表の結果を、行ごとに読んだときと同じ形にそろえる。
   氏名は名簿と照合する。異体字（鄉司／郷司 など）は揃えてから比べる */
function sheetFromColumns(text){
  return sheetColumns(text).map(c=>{
    let hit=nameHits(c.raw,DB.players)[0];
    if(!hit){const k=nzv(c.raw);hit=DB.players.find(p=>nzv(p.n)===k)||null;}
    const why=!hit?"氏名が名簿と照合できませんでした":
      (c.g===null?"グロス・HDCP・ネットがそろっていません":"");
    return {line:c.raw+"　グロス"+(c.g??"—")+"　HDCP"+(c.hc??"—")+"　ネット"+(c.net??"—")
      +(c.filled?"（グロスは HDCP＋ネット で補いました）":""),
      name:hit?hit.n:"",found:!!hit,g:c.g,hc:c.hc,net:c.net,
      holes:null,out:null,inn:null,sure:true,rebuilt:true,filled:c.filled,
      ok:!!hit&&c.g!==null,why};
  });
}
/* ---- 氏名が無い貼り付けに対応する ----
   集計表から数字だけを写した場合や、認識で氏名が落ちた場合。
   行数が出走者の数とそろっているときだけ、上から順に名簿へ当てる。
   並びを間違えると全員のスコアが入れ替わるので、当てた氏名は画面に出して
   必ず目で確かめてもらう。行数が合わないときは何もしない。 */
function sheetAssign(rows){
  const ru=RUN();
  const blank=rows.filter(r=>!r.name);
  if(!blank.length) return {rows,assigned:0};
  if(rows.length!==ru.length) return {rows,assigned:0};
  let k=0;
  const out=rows.map((r,i)=>{
    if(r.name) return r;
    k++;
    return {...r,name:ru[i].n,found:true,byOrder:true,
      ok:r.g!==null&&r.g!==undefined,
      why:(r.g===null||r.g===undefined)?"グロス・HDCP・ネットがそろっていません":""};
  });
  return {rows:out,assigned:k};
}
function parseSheet(text){
  const names=DB.players.map(p=>p.n);
  return tidy(text).split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(line=>{
    const nums=(line.match(/\d+(?:\.\d+)?/g)||[]).map(Number);
    let name="",hit=null;
    for(const n of names){
      const z=nz(n);
      if(nz(line).includes(z)){hit=n;break;}
      const sur=z.slice(0,2);
      if(sur.length>=2&&nz(line).includes(sur)&&!hit) hit=n;
    }
    if(hit) name=hit;
    else{                              /* 名簿と結びつかないときは、数字の前までを氏名とみなす */
      const tk=line.split(/[\s\u3000,\t|]+/).filter(Boolean);
      let i=(/^\d{1,3}$/.test(tk[0]||""))?1:0,nm=[];
      while(i<tk.length&&!/^\d+(?:\.\d+)?$/.test(tk[i])){nm.push(tk[i]);i++;}
      name=nm.join("\u3000");
    }
    const r=sheetTail(nums);
    const hs=r?sheetHoles(nums,r.at):null;
    const why=sheetWhy(name,r);
    return {line,name,found:!!hit,
      g:r?r.g:null, hc:r?r.hc:null, net:r?r.net:null,
      holes:hs?hs.holes:null, out:hs?hs.out:null, inn:hs?hs.inn:null,
      sure:!!(r&&r.sure), ok:!!name&&!why, why};
  });
}

function pasteApply(){

    if(r.hc!==null&&r.hc!==undefined) s.hc=r.hc;
    /* 集計表に3つとも載っていた行だけ、ネットを照合用に控える。
       2つから計算で補った行は、照合しても必ず一致してしまい意味がない */
    if(r.sure&&r.net!==null&&r.net!==undefined) s.netRef=r.net;
    if(r.holes){r.holes.forEach((v,i)=>s.h[i+1]=v);hn++;}
    n++;
  });

  alert(n+"名ぶんを取り込みました。"
    +(hn?"（うち"+hn+"名はホール別のスコアも入りました。「隠しホール＋グロス」または"
        +"「18ホールすべて」に切り替えると、こちらの計算と突き合わせられます）":""));

/* 集計表の印字HDCPと、アプリのダブルペリア計算を突き合わせる。
   当日「アプリが優勝と言っても、それだけで表彰しない」ための材料 */
function sheetCross(){
  const out=[],hs=SC().hidden.slice(0,hiddenN());
  RUN().forEach(p=>{
    const s=scoreOf(p.n);
    const printed=(s.hc===""||s.hc===undefined)?null:+s.hc;
    if(printed===null||!hs.length||!hs.every(hh=>+s.h[hh]>0))return;
    /* hcRaw は「集計表から」モードだと印字値をそのまま返すので使えない。
       ここは入力方式に関係なく、ホール別スコアからペリアを計算する */
    let sum=0;for(const hh of hs) sum+=Math.min(+s.h[hh],capOf(hh));
    let mine=(sum*(SC().system==="new"?3:1.5)-coursePar())*0.8;
    mine=Math.max(0,Math.round(mine*10)/10);
    if(hcCapped()) mine=Math.min(mine,+SC().hcMax);
    out.push({n:p.n,printed,mine,diff:Math.round((mine-printed)*10)/10});
  });
  return out;
}
/* 結果の入力（馬券の上位2名と当選枠・GTOの下位3名・罰金のグロス）が、いまの順位と合っているか。
   合っていなければ、合っていない項目の名前を返す（段階7。スコアを直したあとの反映忘れを防ぐ） */
function resultStale(){
  const st=standings(), out=[];
  if(!st.net.length) return ["スコア"];
  if(U("keiba")&&st.net.length>=2){
    const t=[st.net[0].n,st.net[1].n];
    if(DB.result.top2.join("|")!==t.join("|")) out.push("馬券の上位2名");
    if(DB.meta.kMode!=="馬連"){
      const p1=RUN().find(p=>p.n===t[0]),p2=RUN().find(p=>p.n===t[1]);
      if(p1&&p2&&DB.result.frame!==ck(+p1.f,+p2.f)) out.push("馬券の当選枠");
    }
  }
  if(U("gto")&&st.worst3.length>=3&&DB.result.low.join("|")!==st.worst3.map(r=>r.n).join("|")) out.push("GTOの下位3名");
  if((U("gto")||U("fine"))&&st.rows.some(r=>r.g!==null&&+DB.result.gross[r.n]!==r.g)) out.push("罰金のグロス");
  return out;
}
function applyScores(){
  const st=standings();
  if(!st.net.length){alert("スコアが足りません。");return;}
  if(U("keiba")&&st.net.length>=2){
    DB.result.top2=[st.net[0].n,st.net[1].n];
    if(DB.meta.kMode!=="馬連"){
      const p1=RUN().find(p=>p.n===st.net[0].n),p2=RUN().find(p=>p.n===st.net[1].n);
      if(p1&&p2) DB.result.frame=ck(+p1.f,+p2.f);
    }
  }
  if(U("gto")&&st.worst3.length>=3) DB.result.low=st.worst3.map(r=>r.n);
  st.rows.forEach(r=>{if(r.g!==null) DB.result.gross[r.n]=r.g;});
  touch();go("result");
}

/* 馬券の人気のマス目。予想入力（いま選んでいる組合せと一番人気に印）と集計（当選に印）で使う */
function kGrid(o){
  o=o||{};
  const F=FRAMES(), cnt={};
  DB.keiba.forEach(r=>{const k=ck(r.a,r.b);cnt[k]=(cnt[k]||0)+r.q;});
  const mx=Math.max(1,...Object.values(cnt));
  return `<table class="matrix"><thead><tr><th></th>${F.map(f=>`<th>${chip(f)}</th>`).join("")}</tr></thead><tbody>
    ${F.map(a=>`<tr><th>${chip(a)}</th>${F.map(b=>{
      if(b<a)return '<td style="background:rgba(0,0,0,.25)"></td>';
      const k=ck(a,b), c=cnt[k]||0, hit=o.hit===k;
      const cls=[hit?"hitc":(c?"":"z"), o.sel===k?"selc":"", o.top===k?"topc":""].filter(Boolean).join(" ");
      return `<td class="${cls}" ${c&&!hit?`style="background:rgba(217,177,102,${(c/mx*.5).toFixed(2)})"`:""}>${c||"·"}</td>`;
    }).join("")}</tr>`).join("")}</tbody></table>`;
}
/* 2026-09-20：馬連の人気（口数の多い組合せ順）。枠は8通り程度で総当たりの表が組めるが、
   個人は16名なら120通りにもなり表では見づらいため、GTOの「得票の多い方」と同じ考え方の
   ランキング一覧にする */
function kPairVotes(){
  const cnt={};
  DB.keiba.forEach(r=>{if(kVoid(r))return;const k=ckN(r.a,r.b);cnt[k]=(cnt[k]||0)+(+r.q||0);});
  return Object.entries(cnt).map(([k,c])=>({k,c,names:k.split("／")})).sort((a,b)=>b.c-a.c);
}
/* 未投票の方。馬券とGTOでそれぞれ数える */
function betsWait(list){
  const who=new Set(list.map(r=>nz(r.v)));
  return VOT().filter(p=>nz(p.n)&&!who.has(nz(p.n))).map(p=>p.n);
}

/* ---- 予想の貼り付け解析 ---- */
function nameHits(line,list){
  const z=nz(line),out=[];
  list.forEach(p=>{
    const k=nz(p.n),i=z.indexOf(k);
    if(k&&i>=0) out.push({n:p.n,i,len:k.length});
  });
  /* 短い名前が長い名前に含まれる場合は捨てる */
  const keep=out.filter(a=>!out.some(b=>b!==a&&b.len>a.len&&a.i>=b.i&&a.i+a.len<=b.i+b.len));
  return keep.sort((a,b)=>a.i-b.i);
}
/* nameHits は氏名ごとに最初の1か所しか返さない。GTOでは自分自身への投票を
   認めているため、投票者の欄と指名の欄に同じ氏名が並ぶことがある。
   その行を取りこぼさないよう、出現箇所をすべて拾う版を用意する。
   短い氏名が長い氏名に含まれる場合の扱いは nameHits と同じ */
function nameHitsAll(line,list){
  const z=nz(line),out=[];
  list.forEach(p=>{
    const k=nz(p.n);if(!k)return;
    let i=z.indexOf(k);
    while(i>=0){out.push({n:p.n,i,len:k.length});i=z.indexOf(k,i+1);}
  });
  const keep=out.filter(a=>!out.some(b=>b!==a&&b.len>a.len&&a.i>=b.i&&a.i+a.len<=b.i+b.len));
  return keep.sort((a,b)=>a.i-b.i);
}
function parseKeiba(text){
  const maxF=Math.max(8,...FRAMES());
  return tidy(text).split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(line=>{
    const hit=nameHits(line,VOT())[0];
    const voter=hit?hit.n:"";
    let rest=line;
    if(hit){const k=nz(voter);const z=nz(line);
      /* 氏名部分を取り除く（空白を無視した位置で切る） */
      let cnt=0,st=-1,en=-1;
      for(let i=0;i<line.length;i++){ if(!/[\s\u3000]/.test(line[i])){ if(cnt===hit.i)st=i; cnt++; if(cnt===hit.i+k.length){en=i+1;break;} } }
      if(st>=0&&en>st) rest=line.slice(0,st)+" "+line.slice(en);
    }
    let a=null,b=null,q=1;
    const m=rest.match(/(\d+)\s*[-ー−–—―]\s*(\d+)/);
    if(m){ a=+m[1]; b=+m[2];
      const n2=(rest.replace(m[0]," ").match(/\d+/g)||[]).map(Number).filter(v=>v>=1&&v<=99);
      if(n2.length) q=n2[n2.length-1];
    }else{
      const n=(rest.match(/\d+/g)||[]).map(Number);
      if(n.length>=2){ a=n[0]; b=n[1]; if(n.length>=3) q=n[2]; }
    }
    const ok=!!voter&&a>=1&&b>=1&&a<=maxF&&b<=maxF&&q>=1;
    return {line,voter,a:a&&Math.min(a,b),b:b&&Math.max(a,b),q,ok,
      why:!voter?"投票者が名簿にありません":(a===null?"枠番が読めません":(a>maxF||b>maxF?"枠番が範囲外です":""))};
  });
}
/* 2026-09-20：馬連の貼り付け解析。氏名を3つ拾い、最初を投票者、残り2つを買い目とする
   （GTOの parseGto と同じ考え方。買い目は順不同なので順番は気にしない） */
function parseKeibaPair(text){
  return tidy(text).split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(line=>{
    const all=nameHitsAll(line,DB.players);
    const voter=all.length?all[0].n:"";
    const picks=all.slice(1,3).map(x=>x.n);
    const okV=!!voter&&VOT().some(p=>nz(p.n)===nz(voter));
    const okP=picks.length===2&&picks.every(n=>RUN().some(p=>nz(p.n)===nz(n)))
              &&new Set(picks.map(nz)).size===2;
    const nums=(line.match(/\d+/g)||[]).map(Number).filter(v=>v>=1&&v<=99);
    const q=nums.length?nums[nums.length-1]:1;
    return {line,voter,a:picks[0]||"",b:picks[1]||"",q,ok:okV&&okP,
      why:!okV?"投票者が名簿にありません":
        (picks.length<2?"買い目が2名そろっていません":
         (new Set(picks.map(nz)).size<2?"同じ人を2回指名しています":
          (!okP?"出走しない方が指名されています":"")))};
  });
}
function parseGto(text){
  return tidy(text).split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(line=>{
    const all=nameHitsAll(line,DB.players);
    const voter=all.length?all[0].n:"";
    const picks=all.slice(1,4).map(x=>x.n);
    const okV=!!voter&&VOT().some(p=>nz(p.n)===nz(voter));
    const okP=picks.length===3&&picks.every(n=>RUN().some(p=>nz(p.n)===nz(n)))
              &&new Set(picks.map(nz)).size===3;
    const nums=(line.match(/\d+/g)||[]).map(Number).filter(v=>v>=1&&v<=99);
    const q=nums.length?nums[nums.length-1]:1;
    /* 同じ氏名を2度書いた行は、拾える氏名が2名に減って「3名そろっていない」と
       見えてしまう。書いた側に理由が伝わるよう、繰り返しを別に数えて知らせる。
       自分自身への投票は認めているので、投票者の欄に出る1回分は差し引く。
       照合の対象は nameHits が採用した氏名だけにする（短い氏名が長い氏名に
       含まれる場合の数え違いを避けるため） */
    const z=nz(line),cnt=k=>k?z.split(k).length-1:0;
    const rep=all.filter(x=>{const k=nz(x.n);
      return cnt(k)-(nz(voter)===k?1:0)>=2;}).map(x=>x.n);
    return {line,voter,picks,q,ok:okV&&okP,
      why:!okV?"投票者が名簿にありません":
        (rep.length?"同じ人を2回以上指名しています（"+rep.join("、")+"）":
         (picks.length===3&&new Set(picks.map(nz)).size<3?"同じ人を2回以上指名しています":
          (picks.length<3?"指名が3名そろっていません":
           (!okP?"出走者以外が指名されています":""))))};
  });
}

/* ---- V1 の形に整える（V1・M1） ----
   どのファイル・自動保存を開いても最後にここを通す。お金の項目（予想の単価・罰金の単価・賞金の原資・
   口数の見込み・賞ごとの金額・原資の個別額）を取り除き、賞品（品名と出どころ）と経費の新しい項目を補う。
   取り除かないと、社内版（v68）のファイルから金額が紛れ込み、画面のどこかに円が出る */
function v1Clean(o){
  const m=o.meta;
  ["kPrice","gPrice","fineUnit"].forEach(k=>delete m[k]);
  const b=m.budget||(m.budget={});
  ["fee","kGuess","gGuess"].forEach(k=>delete b[k]);
  if(!Array.isArray(b.collect)) b.collect=[];
  b.collect.forEach(x=>{ if(!x.mode) x.mode="each"; if(!x.to) x.to="play"; });
  if(b.prizeCap===undefined) b.prizeCap="";
  if(b.leftover===undefined) b.leftover="carry";
  const P=m.prizes||(m.prizes={});
  if(!Array.isArray(P.rank)) P.rank=[];
  P.rank.forEach(r=>{ delete r.amt; if(r.item===undefined) r.item=""; if(!r.src) r.src="host"; });
  if(!P.gift||typeof P.gift!=="object") P.gift={};
  GIFTKEYS.forEach(k=>{ if(typeof P[k]!=="object"||P[k]===null) delete P[k];
    if(!P.gift[k]||typeof P.gift[k]!=="object") P.gift[k]={item:"",src:"host"}; });
  (o.players||[]).forEach(p=>{ delete p.feeAmt; });
  return o;
}

function fromV68(d){

function migrate(d){
  const b=blank();
  if(d.v===2){
    const o=Object.assign(b,d,{meta:Object.assign(b.meta,d.meta||{}),
      result:Object.assign(b.result,d.result||{})});
    const src=(d.meta&&d.meta.sc)||{};
    o.meta.sc=Object.assign(blank().meta.sc,src);
    if(src.hcUse===undefined) o.meta.sc.hcUse=(+o.meta.sc.hcMax>0);
    if(src.entry===undefined) o.meta.sc.entry=src.allHoles?"all":"hidden";
    o.meta.use=Object.assign(blank().meta.use,(d.meta&&d.meta.use)||{});
    /* 3段階（2026-09-16）より前のファイルは dayMode しか持たない */

    o.scores=d.scores||{}; o.nearAny=d.nearAny||[]; o.paid=d.paid||{}; o.courses=d.courses||[];
    o.meta.prizes=Object.assign(blank().meta.prizes,(d.meta&&d.meta.prizes)||{});

    o.meta.lucky=Object.assign(blank().meta.lucky,(d.meta&&d.meta.lucky)||{});
    o.result.lucky=(d.result&&d.result.lucky)||[];
    o.meta.budget=Object.assign(blank().meta.budget,(d.meta&&d.meta.budget)||{});
    o.players.forEach(p=>{ if(p.fee===undefined) p.fee=(+p.f>0); });

  }

  b.meta.name=(d.meta&&d.meta.org)||b.meta.name;
  b.meta.place=(d.meta&&d.meta.place)||"";
  b.meta.date=(d.meta&&d.meta.date)||"";
  b.meta.gMode=(d.meta&&d.meta.mode)||"3連複";
  b.meta.use={score:false,near:false,nearAny:false,drako:false,keiba:true,gto:true,fine:true,prize:false,budget:false};
  b.meta.frameMode="manual";
  b.players=(d.roster||[]).map(p=>{const f=(p.run===false?0:+p.f||0);
    return {n:p.n,org:"",bd:"",g:0,f,vote:p.vote!==false,fee:f>0};});
  b.keiba=d.keiba||[];b.gto=d.gto||[];
  b.result=Object.assign(b.result,d.result||{});
  return b;
}
function upJson(f){

       札の無いファイルは v68（社内版）のもの。確かめてから、予想・受け取りの記録を捨てて取り込む（M1） */
    const v68=!d.app;
    if(v68&&!confirm("社内版（CompeMaster Pro v68）のファイルです。\n"
      +"参加者・組・コース・スコア・賞の名前と、経費の項目を取り込みます。\n"
      +"予想（馬券・GTO）・賞金の額・賞金の原資・受け取りの記録は取り込みません。よろしいですか。")) return;
    if(v68) fromV68(d);
    delete d.app; delete d.schema;
    const next=migrate(d);
    /* 2026-09-21：いまの大会に実データがあるまま読み込むと、保存していない変更が
       無確認で失われていた（事故報告により追加）。読み込む前に確認し、控えも残す */
    const has=hasRealData();

  }catch(e){alert("読み込めませんでした。このアプリで書き出したJSONを選んでください。");}};
  r.readAsText(f);
}

   ①と同じ16名を使い、違うのは中身だけ。 */
function sampleHard(){
  sample();                       /* まず①を作り、そこから崩す */
  DB.meta.name="第10回 親睦ゴルフコンペ（つまずきやすい例・宿泊あり）";
  /* 宿泊ありにすると実費が増え、数え方も混ざる。
     ガソリン代・高速代は乗り合わせで総額が決まるので頭割り。
     割り切れない額にして、切り上げの余りが出る形にしてある */
  DB.meta.budget.collect=[
    {label:"プレー代（グリーンフィー・昼食）",amt:13500,mode:"each"},
    {label:"宿泊代（1泊2食）",amt:11000,mode:"each"},
    {label:"夕食・宴会代",amt:5000,mode:"each"},
    {label:"車代（1台あたり）",amt:5000,mode:"unit"},
    {label:"ガソリン代・高速代（1台あたり）",amt:9250,mode:"unit"}];
  /* 4名が1台ずつ出す。単価の合計 14,250円 × 4台を全員から集め、
     この4名へそれぞれ 14,250円 返す */
  [0,4,8,12].forEach(i=>{DB.players[i].cars=1;});
  const N=DB.players.map(p=>p.n);

  /* ---- ① 欠席者を2名つくる ----
     組を「未定」にすると出走者から外れる。その人を指名したGTOの口は
     無効になり、掛金は返る。得票にも数えない。
     枠も0にするので、枠が2つ減って6枠になる（当日よくある崩れ方） */
  [7,12].forEach(i=>{DB.players[i].g=0;DB.players[i].f=0;DB.players[i].skill="";});

  /* ---- ①'' プレーせず予想だけ参加する人を1名 ----
     実費も会費もかからず、馬券・GTOの代金だけを集める。
     順位・技能賞・罰金の対象にもならない。当日いちばん間違えやすい */
  DB.players[7].fee=false; DB.players[7].vote=true;

  /* ---- ①' 枠を組みなおして、崩れた形を作る ----
     欠席で2名抜けた14名を7枠に入れ、そのうち1枠だけ同じ組どうしにする。
     組をまたいでいない枠が混じると、ネット上位2名が同じ枠に入りやすく
     馬券が荒れる。参加者タブに警告が出ることを確かめるため */
  {
    const run=DB.players.filter(p=>+p.g>0);
    run.forEach(p=>p.f=0);
    /* 1枠だけ「1組の2人」で作り、残りは組をまたいで2人ずつ */
    const g1=run.filter(p=>+p.g===1);
    let f=1;
    if(g1.length>=2){ g1[0].f=f; g1[1].f=f; f++; }
    const rest=run.filter(p=>+p.f===0);
    const byG={};
    rest.forEach(p=>{const g=+p.g;(byG[g]=byG[g]||[]).push(p);});
    const cols=Object.keys(byG).sort((a,b)=>+a-+b).map(k=>byG[k]);
    const order=[];
    for(let r=0;cols.some(c=>c[r]);r++) cols.forEach(c=>{if(c[r])order.push(c[r]);});
    order.forEach((p,c)=>{ if(c%2===0&&c>0)f++; p.f=f; });
  }

  /* ---- ② ノーカード（失格）を1名 ----
     グロスを空欄のままにする。順位・下位3名・罰金のすべてから外れる */
  const nc=scoreOf(N[10]);
  DB.meta.sc.par.forEach((_,k)=>nc.h[k+1]="");
  nc.gross=""; nc.hc="";

  /* ---- ③ ネットとグロスに同点をつくる ----
     ネットが並べば生年月日で決まる。グロスが並べば下位3名の並びが揺れる。
     どちらも「アプリが勝手に決めた」ように見えるので、事前に確かめておく */
  const pair=(a,b)=>{const x=scoreOf(N[a]),y=scoreOf(N[b]);
    DB.meta.sc.par.forEach((_,k)=>y.h[k+1]=x.h[k+1]);
    y.gross=x.gross;};
  pair(1,2);                      /* ネットもグロスも完全に同じ2人 */
  pair(13,14);                    /* 下位側にも同点をつくる */

  /* ---- ④ 選抜者の得票を並ばせる ----
     3位が同票だと、会長の判断（手動指定）が要る。その画面を出しておく */
  DB.gto=[];
  /* 3位を同票にする。ノーカードの人（10番）は指名から外し、
     グロスの入っている人だけで並ばせる */
  const G2=[
[13,6,15,1],[6,15,14,1],[9,4,14,2],[13,6,9,3],
            [6,9,14,3],[14,4,15,2],[15,6,13,3],[14,4,9,1],
            [6,9,15,3],[6,9,14,2],[14,6,15,3],[14,15,13,1]];

  G2.forEach(([a,b,c,q],k)=>DB.gto.push({v:N[k%16],p:[N[a],N[b],N[c]],q}));

  /* ---- ⑤ 無効になる口を3種そろえる ----
     欠席者を指名した口・同じ人を2回指名した口・無くなった枠を指名した口。
     「集計」タブに一覧で出て、掛金が返ることを確かめる */
  DB.gto.push({v:N[0],p:[N[7],N[9],N[11]],q:2});      /* 欠席者を指名 */
  DB.gto.push({v:N[1],p:[N[9],N[9],N[11]],q:1});      /* 同じ人を2回 */
  DB.keiba.push({v:N[2],a:1,b:9,q:2});                /* 無くなった枠 */

  /* ---- ⑥ 技能賞に該当者のいないホールを混ぜる ----
     全員グリーンを外した、誰も飛ばせなかった、という場面。
     用意する賞金と実際に出る賞金がずれる */
  DB.near=[{hole:3,who:N[0],rec:"1.2m"},{hole:7,who:"",rec:""},
           {hole:11,who:N[9],rec:"2.1m"},{hole:16,who:"",rec:""}];
  DB.nearAny=[{hole:9,who:N[3],rec:"0.6m"},{hole:18,who:"",rec:""}];
  DB.drako=[{hole:4,who:N[6],rec:"282Y"},{hole:14,who:"",rec:""}];

  /* ---- ⑦ 対象ホールをわざとパーと噛み合わせない ----
     「大会設定」に警告が出て、ボタン1つで直せることを確かめる */
  DB.meta.drakoHoles=[5,14];   /* 5番はパー4。14番は合っている */

  applyScores();
  touch();go("players");
}

/* ================= 音 ================= */
let AC=null,GAIN=null,SND=true,VOL=.8,rollTimer=null,rollStep=0,CUES=[],TIMERS=[];
function ac(){
  if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();
    /* ここは長らく MASTER=AC.createGain() と書かれていた。MASTER はゴルフ場マスタの
       const 配列なので代入で例外になり、音は一度も鳴っていなかった（2026-09-04に発見）。
       さらに GAIN が null のままなので、次の行でも例外になっていた */
    GAIN=AC.createGain();GAIN.gain.value=VOL;GAIN.connect(AC.destination);}
  if(AC.state==="suspended"){try{AC.resume();}catch(e){}}
  return AC;
}
function setVol(v){VOL=v/100;if(GAIN)GAIN.gain.value=VOL;}
function toggleSound(){SND=!SND;const b=document.getElementById("sndBtn");if(b)b.textContent="音 "+(SND?"ON":"OFF");if(!SND)silence();}
["pointerdown","keydown"].forEach(e=>document.addEventListener(e,()=>{if(AC&&AC.state==="suspended"){try{AC.resume();}catch(x){}}}));
function cue(){const g=ac().createGain();g.gain.value=1;g.connect(GAIN);CUES.push(g);return g;}
function later(f,ms){TIMERS.push(setTimeout(f,ms));}
function silence(){
  stopRoll();TIMERS.forEach(clearTimeout);TIMERS=[];
  if(!AC){CUES=[];return;}
  const t=AC.currentTime;
  CUES.forEach(g=>{try{g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);
    g.gain.linearRampToValueAtTime(0,t+.14);setTimeout(()=>{try{g.disconnect();}catch(e){}},240);}catch(e){}});
  CUES=[];
}
function noise(dur,hz,peak,out){
  const c=ac(),t=c.currentTime,len=Math.max(1,Math.floor(c.sampleRate*dur));
  const b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const s=c.createBufferSource();s.buffer=b;
  const hp=c.createBiquadFilter();hp.type="highpass";hp.frequency.value=hz;
  const g=c.createGain();g.gain.setValueAtTime(peak,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  s.connect(hp);hp.connect(g);g.connect(out||GAIN);s.start(t);s.stop(t+dur+.02);
}
function drum(acc,out){
  const c=ac(),t=c.currentTime;noise(.07,1300,acc?.7:.34,out);
  const o=c.createOscillator(),g=c.createGain();
  o.type="sine";o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(72,t+.09);
  g.gain.setValueAtTime(acc?.45:.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.11);
  o.connect(g);g.connect(out||GAIN);o.start(t);o.stop(t+.13);
}
function brass(hz,dl,dur,peak,out){
  const c=ac(),t=c.currentTime+dl;
  const o=c.createOscillator(),o2=c.createOscillator(),lp=c.createBiquadFilter(),g=c.createGain();
  o.type=o2.type="sawtooth";o.frequency.value=hz;o2.frequency.value=hz*1.006;
  lp.type="lowpass";lp.frequency.setValueAtTime(700,t);
  lp.frequency.linearRampToValueAtTime(4600,t+.09);lp.frequency.linearRampToValueAtTime(1800,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+.028);
  g.gain.setValueAtTime(peak,t+dur*.55);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(lp);o2.connect(lp);lp.connect(g);g.connect(out||GAIN);
  o.start(t);o2.start(t);o.stop(t+dur+.06);o2.stop(t+dur+.06);
}
function bell(hz,dl,dur,peak,out){
  const c=ac(),t=c.currentTime+(dl||0);
  const o=c.createOscillator(),g=c.createGain();
  o.type="triangle";o.frequency.value=hz;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak||.3,t+.012);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(out||GAIN);o.start(t);o.stop(t+dur+.05);
}
function pad(fs,at,hold,out){
  const c=ac(),t=c.currentTime;
  fs.forEach(hz=>{const o=c.createOscillator(),g=c.createGain();
    o.type="sine";o.frequency.value=hz;g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(.13,t+at);g.gain.setValueAtTime(.13,t+at+hold);
    g.gain.exponentialRampToValueAtTime(.001,t+at+hold+1.1);
    o.connect(g);g.connect(out);o.start(t);o.stop(t+at+hold+1.3);});
}

const ACT_HIT=2320;

function pluck(i){if(!SND)return;bell(PENTA[i%PENTA.length]*(i>=PENTA.length?2:1),0,.5,.26);}
function applause(dur){
  if(!SND)return;dur=dur||2.8;
  const c=ac(),t=c.currentTime,out=cue(),len=Math.floor(c.sampleRate*dur);
  const b=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let g=1;
    for(let i=0;i<len;i++){const p=i/len;
      const env=p<.10?p/.10:Math.pow(1-(p-.10)/.90,1.5);
      if(i%64===0)g=.25+Math.random();
      d[i]=(Math.random()*2-1)*env*g;}}
  const s=c.createBufferSource();s.buffer=b;
  const bp=c.createBiquadFilter();bp.type="bandpass";bp.frequency.value=1700;bp.Q.value=.65;
  const g2=c.createGain();g2.gain.value=.55;
  s.connect(bp);bp.connect(g2);g2.connect(out);s.start(t);s.stop(t+dur+.05);
}
function cheer(n){if(n<=0){thud();return;}
  for(let i=0;i<n;i++)later(()=>pluck(i),90*i+60);
  later(()=>applause(n>=4?3.2:2.4),90*n+220);}
function revealTone(l){if(!SND)return;
  if(l===3){bell(N.D5,0,.7,.26);drum(false);}
  else if(l===2){bell(N.Fs5,0,.5,.26);bell(N.A5,.12,.8,.26);drum(true);}
  else fanfare();}
function fanfare(){if(!SND)return;const out=cue();
  [[N.G4,0,.18],[N.Cs5,.15,.18],[N.E5,.30,.18],[N.G5,.45,.24]].forEach(a=>brass(a[0],a[1],a[2],.20,out));
  [N.Cs5,N.E5,N.G5,1318.5].forEach(hz=>brass(hz,.72,1.30,.13,out));
  later(()=>{noise(1.4,5200,.34,out);drum(true,out);},720);}
function penalty(){if(!SND)return;drum(true);
  brass(N.A4,0,.34,.17);brass(N.Fs4,.30,.34,.17);brass(N.D4,.60,.95,.19);}
function thud(){if(!SND)return;drum(true);brass(N.D4,0,.5,.16);}

function prizeSlides(key,label){
  const list=(DB.meta[HOLEKEY[key]]||[]);
  if(!list.length) return [];
  /* 受賞者のいないホールは発表しない。読み上げる相手がいないのに
     「該当なし」の画面を出すと場が止まる。
     1ホールも受賞者がいなければ、見出しごと出さない（2026-09-08） */
  const won=list.filter(h=>{const r=DB[key].find(x=>+x.hole===h);return r&&r.who;});
  if(!won.length) return [];
  const out=[{id:key+"-in",lab:label.replace(/[\s　]/g,""),enter:()=>thud(),html:()=>`<div class="kicker">${label}</div>
    <div class="title" style="font-size:clamp(28px,5.6vw,76px)">${label}</div><div class="rule"></div>
    <div class="sub">対象ホール　${won.join("　/　")}</div>`}];
  won.forEach(h=>{

    const lab=label.replace(/[\s　]/g,"");
    out.push({id:key+h,lab:lab+" "+h+"番",who:r.who,rv:1,enter:e=>reveal(e,2),html:()=>`<div class="ws">

        ${U("prize")&&r.who?`<div class="ws-prize">${lab}賞<b>${esc(itemText(giftOf(key)))}</b></div>`:""}

  return out;

  if(U("fine")&&B.sel.filter(Boolean).length){
    slides.push(Object.assign({id:"b-sel",lab:"選抜者",who:B.sel.filter(Boolean).join("・")},actSlide(actNo(),"選 抜 者",
      "GTOで投票を最も多く集めた"+DB.meta.fineTop+"名",
      ()=>`<div class="sel-cards">${B.sel.filter(Boolean).map((n,i)=>`
        <div class="sel-card" style="animation-delay:${i*.16}s"><div class="rk">第 ${i+1} 位</div>
          <div class="nm">${esc(n)}</div>
          <div class="vt">${B.sg[i]!==undefined&&B.sg[i]!==""?"グロス "+B.sg[i]:"&nbsp;"}</div></div>`).join("")
        ||'<p class="none">未設定</p>'}</div>`)));
    /* V1（M1）：罰金の幕は「選抜者に負けた数」の発表だけ。お金は動かない（ptの発表は M3） */
    slides.push({id:"b-fine",lab:"罰金",who:B.lostSum?B.list.length+"名":"該当者なし",enter:()=>{B.lostSum>0?penalty():bell(784,0,.6,.3);},html:()=>B.lostSum>0?
      `<div class="kicker">罰　金</div>
       <div class="sub" style="margin-bottom:2vmin">選抜者にグロスで及ばなかった方</div>
       <div class="fine-tbl">${B.list.map((w,i)=>`<div class="fine-row" style="animation-delay:${i*.12}s">
         <span class="fn">${esc(w.n)}</span><span class="fg">${w.g}</span>
         <span class="fa">${w.lost}名に敗れ</span></div>`).join("")}</div>
       <div class="stats"><div class="stat"><i>該当</i><b style="color:var(--hit)">${B.list.length}名</b></div></div>`:
      `<div class="kicker">罰　金</div><div class="rule"></div>
       <div class="title" style="font-size:clamp(22px,4.4vw,58px)">該当者なし</div>`});
  }
  if(U("lucky")){
    slides.push({id:"lucky",lab:"ラッキー賞",enter:luckyRoll,
      html:()=>`<div class="kicker">ラ ッ キ ー 賞</div>
        <div class="sub" style="margin-bottom:3vmin">まだ何も当たっていない ${luckyPool().length}名から ${LK().count}名</div>
        <div class="name-xl" id="lkName" style="min-height:1.2em">　</div>
        <div class="winners" id="lkList" style="margin-top:4vmin"></div>`});
  }
  slides.push({id:"end",lab:"締め",enter:()=>outro(),html:()=>`<div class="kicker">締　め</div>
    <div class="title" style="font-size:clamp(20px,3.8vw,50px)">${esc(DB.meta.name||"")}</div>
    <div class="rule"></div>
    <div class="rule"></div><div class="sub">おつかれさまでした</div>`});
}
function luckyRoll(el){
  const nameEl=el.querySelector("#lkName"),listEl=el.querySelector("#lkList");
  const pool=luckyPool().map(p=>p.n);
  let win=(DB.result.lucky||[]).filter(n=>n);
  if(!win.length&&pool.length){ const a=pool.slice();
    for(let i=0;i<Math.min(+LK().count||1,a.length);i++) win.push(a.splice(Math.floor(Math.random()*a.length),1)[0]);
    DB.result.lucky=win; }
  if(!pool.length){nameEl.textContent="対象者なし";return;}
  let k=0;
  const spin=(i)=>{
    let step=0;startRoll();
    const run=()=>{
      nameEl.textContent=pool[Math.floor(Math.random()*pool.length)];
      step++;
      if(step<34) later(run,step<22?60:60+(step-22)*(step-22)*8);
      else{ stopRoll(); nameEl.textContent=win[i]||"—"; pluck(i); 
        listEl.insertAdjacentHTML("beforeend",
          `<div class="winner">${esc(win[i]||"—")}${U("prize")&&nz(giftOf("lucky").item)?`<em>${esc(giftOf("lucky").item)}</em>`:""}</div>`);
        if(i+1<win.length) later(()=>spin(i+1),700);
        else later(()=>applause(3.0),300);
      }};
    later(run,300);
  };
  spin(0);
}
function drawFrames(el){
  const combo=el.querySelector("#combo"),names=el.querySelector("#comboNames");
  const box=combo.querySelectorAll(".big-no"),F=FRAMES();
  const paint=(i,f)=>{const c=FC(f);box[i].style.background=c.bg;box[i].style.color=c.fg;box[i].textContent=f;};
  let step=0;startRoll();
  const run=()=>{
    const pick=()=>F[Math.floor(Math.random()*F.length)]||0;
    paint(0,pick());paint(1,pick());step++;
    if(step<40)later(run,step<26?70:70+(step-26)*(step-26)*7);
    else{stopRoll();paint(0,S.fa);paint(1,S.fb);combo.classList.remove("rolling");
      names.innerHTML=`<span>${inFrame(S.fa).map(esc).join("・")}</span><span>${inFrame(S.fb).map(esc).join("・")}</span>`;
      gateOpen();}};
  later(run,420);
}
/* 2026-09-20：馬連の当選ペア発表。枠番の代わりに氏名がスロットのように回って止まる版 */
function drawPair(el){
  const combo=el.querySelector("#combo"),names=el.querySelector("#comboNames");
  const box=combo.querySelectorAll(".big-no"),R=RUN();
  const short=n=>n?String(n).split(/[\s　]/)[0]:"？";
  const paint=(i,n)=>{box[i].textContent=short(n);};
  let step=0;startRoll();
  const run=()=>{
    const pick=()=>{const p=R[Math.floor(Math.random()*R.length)];return p?p.n:"";};
    paint(0,pick());paint(1,pick());step++;
    if(step<40)later(run,step<26?70:70+(step-26)*(step-26)*7);
    else{stopRoll();const t=DB.result.top2;paint(0,t[0]);paint(1,t[1]);combo.classList.remove("rolling");
      names.innerHTML=`<span>${esc(orgOf(t[0])||"")}</span><span>${esc(orgOf(t[1])||"")}</span>`;
      gateOpen();}};
  later(run,420);
}
function reveal(el,lv){const v=el.querySelector("#veil");startRoll();
  later(()=>{stopRoll();if(v)v.classList.remove("hidden");revealTone(lv);},lv===1?2100:1500);}
/* step は数え上げの刻み。口数のような小さな数は 1 で数える（100刻みだと最後まで0のまま） */
function countUp(id,target,step){
  const el=document.getElementById(id);if(!el)return;
  const dur=1500,t0=performance.now();let last=0,st=step||100;
  const f=t=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);
    el.textContent=yen(Math.round(target*e/st)*st);
    if(t-last>Math.max(40,260*p*p)){last=t;tickUp();}
    if(p<1)requestAnimationFrame(f);else{el.textContent=yen(target);land();}};
  requestAnimationFrame(f);
}
/* ---- スクリーンの枠（段階7） ----
   上に大会名・日付・会場と「何枚目 / 全部」。下に前の発表・進みの点・次の予告。
   次の予告は賞の名前だけ（受賞者名は出さない。9/17の決定）。前の発表は、伏せていた名前が出たあとなので名前も出す */
const slLab=s=>s?(s.lab||""):"";
function slideFrame(){
  const m=DB.meta, p=slides[idx-1], n=slides[idx+1];
  const top=`<div class="sf-top"><span>${esc([m.name,m.date,m.place].filter(Boolean).join(" ・ "))}</span><b>${idx+1} / ${slides.length}</b></div>`;
  const bot=`<div class="sf-bot"><span class="sf-prev">${p?"← "+esc(slLab(p))+(p.rv&&p.who?" "+esc(p.who):""):""}</span>
    <span class="sf-dots">${slides.map((_,i)=>`<i class="${i===idx?"on":i<idx?"done":""}"></i>`).join("")}</span>
    <span class="sf-next">${n?"次："+esc(slLab(n))+" →":"最後の画面です"}</span></div>`;
  return [top,bot];
}
function draw(){
  const s=slides[idx];armed=false;
  const [ft,fb]=slideFrame();
  show.innerHTML=`${ft}<div class="slide on" id="cur">${s.html()}</div>${fb}`;
  /* 表彰式の最中に音の不具合で画面が止まらないよう、ここで受け止める。
     2026-09-04まで、音の例外が draw() を抜けて進捗の点が更新されなくなっていた */
  if(s.enter){try{s.enter(document.getElementById("cur"));}catch(e){
    console.error("演出の再生でつまずきました（画面は続行します）",e);}}
  dots.innerHTML=slides.map((_,i)=>`<div class="dot ${i===idx?"on":""}"></div>`).join("");
  panelPaint();
}
function step(d){silence();const n=idx+d;if(n<0||n>=slides.length)return;idx=n;draw();}
function advance(){const s=slides[idx];
  if(s.arm&&!armed){armed=true;s.arm(document.getElementById("cur"));return;}step(1);}
function startShow(){buildSlides();idx=0;document.body.className="showing";panelMark();draw();
  if(SND){try{ac().resume();}catch(e){}}}
function fullToggle(){
  try{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }catch(e){}
}
function backToWork(){silence();document.body.className="work";render();panelPaint();}
/* ---- 幹事の操作パネル（2026-09-17、段階7。9/17の決定） ----
   別ウィンドウで開き、開いている間はスクリーンの操作の帯（HUD）を隠す。プロジェクターには発表だけが映る。
   パネルには次の受賞者名も出す（読み上げの準備のため。スクリーンには出さない）。
   ウィンドウは空のページを開いて中身を書き込むので、同じ出どころになり、ファイルを直接開いても
   オフラインでも、こちらの関数をそのまま呼べる（通信や BroadcastChannel は使わない）。
   スクリーンの全画面は、スクリーン側の操作（F キー）でしか切り替えられない（ブラウザの決まり） */
let PANEL=null;
const panelOn=()=>{ try{ return !!(PANEL&&!PANEL.closed); }catch(e){ return false; } };
function panelMark(){
  const on=panelOn();
  if(show&&show.classList) show.classList.toggle("paneled",on);
  if(hud&&hud.classList) hud.classList.toggle("off",on);
}
/* パネルの見た目と骨組み。
   【注意】スクリプトの中に文書の骨組みの札（doctype・html・head・body）を書かない。
   このファイルはそれらの札を省いた書き方なので、スクリプトの中の札を本文の始まりと取り違える道具がある
   （2026-09-17、v51の初版で Claude のプレビューが崩れた。design.js が検査する）。
   そのため、開いた空のページに DOM で題名・スタイル・本文を差し込む */
const PANEL_CSS=`:root{--board:#081810;--panel:#10291E;--rule:#2E5944;--ink:#F4F1E5;--dim:#93AC9D;--brass:#D9B166}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--board);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;padding:18px 20px}
button{font:inherit;color:inherit;background:none;border:1px solid var(--rule);border-radius:10px;cursor:pointer}
button:hover{border-color:var(--brass)}
h1{font-size:13px;color:var(--dim);font-weight:600;display:flex;justify-content:space-between}
h1 b{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--brass)}
.now{margin-top:10px;padding:14px 16px;background:var(--panel);border-radius:14px}
.now small,.next small{display:block;font-size:11px;color:var(--dim);letter-spacing:.1em}
.now b{display:block;margin-top:4px;font-size:26px}
.now span{display:block;margin-top:4px;font-size:15px;color:var(--brass)}
.next{margin-top:10px;padding:12px 16px;border:1px dashed var(--rule);border-radius:14px}
.next b{display:block;margin-top:4px;font-size:18px}
.next span{display:block;margin-top:2px;font-size:14px;color:var(--brass)}
.act{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:14px}
.act button{min-height:64px;font-size:18px;font-weight:700}
#pn-next{background:var(--brass);border-color:var(--brass);color:var(--board)}
.sub{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--dim)}
.sub button{min-height:36px;padding:6px 12px}
ol{margin-top:14px;max-height:34vh;overflow:auto;list-style:none;border-top:1px solid var(--rule)}
li button{display:flex;gap:10px;width:100%;padding:6px 8px;border:none;border-radius:6px;text-align:left;font-size:13px}
li button i{min-width:2.4em;font-style:normal;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--dim)}
li button em{margin-left:auto;font-style:normal;color:var(--dim)}
li.on button{background:var(--panel);color:var(--brass)}
.idle{margin-top:14px;font-size:14px;color:var(--dim)}`;
const PANEL_TITLE="操作パネル — CompeMaster Pro";
const panelBody=()=>`<h1><span id="pn-title">操作パネル</span><b id="pn-pos">—</b></h1>
<div id="pn-body"></div>
<div class="sub">← → / スペースで送る ・ スクリーンの全画面はスクリーン側で F キー</div>`;
/* 開いたページに差し込む。同じ名前のパネルが残っていたときも、中身とキーの受け手を1つにする */
function panelBuild(w){
  const d=w.document;
  d.title=PANEL_TITLE;
  if(d.documentElement) d.documentElement.lang="ja";
  const hd=d.head||d.documentElement;
  hd.innerHTML="";
  const meta=d.createElement("meta"); meta.setAttribute("charset","utf-8"); hd.appendChild(meta);
  const t=d.createElement("title"); t.textContent=PANEL_TITLE; hd.appendChild(t);
  const st=d.createElement("style"); st.textContent=PANEL_CSS; hd.appendChild(st);
  d.body.innerHTML=panelBody();
}
/* パネルの中身を、いまの発表に合わせて書き直す */
function panelPaint(){
  if(!panelOn()||!winOk(PANEL)) { panelMark(); return; }
  const d=PANEL.document, body=d.getElementById("pn-body"), pos=d.getElementById("pn-pos"), tt=d.getElementById("pn-title");
  if(!body) return;
  const showing=document.body.classList.contains("showing")&&slides.length;
  if(tt) tt.textContent=(DB.meta.name||"発表")+" 操作パネル";
  if(!showing){
    if(pos) pos.textContent="—";
    body.innerHTML=`<div class="idle">いまは発表していません。</div>
      <div class="act"><button id="pn-close">閉じる</button><button id="pn-start">▶ 発表をはじめる</button></div>`;
    d.getElementById("pn-start").onclick=()=>startShow();
    d.getElementById("pn-close").onclick=()=>PANEL.close();
    return;
  }
  const s=slides[idx], n=slides[idx+1];
  if(pos) pos.textContent=(idx+1)+" / "+slides.length;
  body.innerHTML=`<div class="now"><small>いま</small><b>${esc(slLab(s))}</b>${s.who?`<span>${esc(s.who)}</span>`:""}</div>
    <div class="next"><small>次</small>${n?`<b>${esc(slLab(n))}</b>${n.who?`<span>${esc(n.who)}</span>`:""}`:"<b>最後の画面です</b>"}</div>
    <div class="act"><button id="pn-prev">← 戻る</button><button id="pn-next">次へ →</button></div>
    <div class="sub"><button id="pn-snd">${SND?"音 ON":"音 OFF"}</button>
      <label>音量 <input id="pn-vol" type="range" min="0" max="100" value="${Math.round(VOL*100)}"></label>
      <button id="pn-back">作業画面にもどる</button></div>
    <ol>${slides.map((x,i)=>`<li class="${i===idx?"on":""}"><button data-i="${i}"><i>${i+1}</i>${esc(slLab(x))}<em>${x.who&&i>idx?"":esc(x.who||"")}</em></button></li>`).join("")}</ol>`;
  d.getElementById("pn-prev").onclick=()=>step(-1);
  d.getElementById("pn-next").onclick=()=>advance();
  d.getElementById("pn-snd").onclick=()=>{toggleSound();panelPaint();};
  d.getElementById("pn-vol").oninput=e=>setVol(e.target.value);
  d.getElementById("pn-back").onclick=()=>backToWork();
  d.querySelectorAll("li button").forEach(b=>b.onclick=()=>panelJump(+b.dataset.i));
  const on=d.querySelector("li.on"); if(on&&on.scrollIntoView) on.scrollIntoView({block:"nearest"});
}
function panelJump(i){ if(i<0||i>=slides.length) return; silence(); idx=i; draw(); }
/* 開いたウィンドウに触れるか。ファイルを直接開いているとき、スクリーン側を読み込み直すと、
   残っていたパネルは別の出どころになり、触れると例外になる（2026-09-17、ブラウザでの確認で発覚） */
const winOk=w=>{ try{ return !!(w&&w.document&&w.document.body); }catch(e){ return false; } };
let PANELN=0;
function panelOpen(){
  if(panelOn()&&winOk(PANEL)){ try{PANEL.focus();}catch(e){} return; }
  const can=typeof window!=="undefined"&&typeof window.open==="function";
  let w=can?window.open("","compePanel","width=720,height=640"):null;
  if(w&&!winOk(w)){
    /* 残っていたパネルには触れないので閉じて、同じ名前で開き直す（閉じるのは開いた側でなくてもできる）。
       閉じきる前の同じウィンドウが返るブラウザでは、別の名前で開く（使えないパネルを残さないため、まず同じ名前） */
    try{ w.close(); }catch(e){}
    w=window.open("","compePanel","width=720,height=640");
    if(w&&!winOk(w)) w=window.open("","compePanel"+(++PANELN),"width=720,height=640");
    if(w&&!winOk(w)) w=null;
  }
  if(!w){ alert("操作パネルを開けませんでした。ブラウザでこのページのポップアップを許可してください。"); return; }
  PANEL=w;
  panelBuild(w);
  /* 受け手は1つだけ（addEventListener だと、残っていたパネルを開き直すたびに増える） */
  w.document.onkeydown=e=>{
    if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();advance();}
    if(e.key==="ArrowLeft"){e.preventDefault();step(-1);}
  };
  w.onpagehide=()=>{ PANEL=null; panelMark(); };
  panelMark(); panelPaint();
}
document.addEventListener("keydown",e=>{
  if(!document.body.classList.contains("showing"))return;
  if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();advance();}
  if(e.key==="ArrowLeft")step(-1);
  if(e.key.toLowerCase()==="f")document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
  if(e.key.toLowerCase()==="m")toggleSound();
  if(e.key==="Escape")backToWork();
});
show.addEventListener("click",()=>{if(document.body.classList.contains("showing"))advance();});
/* 横スワイプでもめくれるように（スマホ・タブレット） */
let TX=0,TY=0;
show.addEventListener("touchstart",e=>{const t=e.changedTouches[0];TX=t.clientX;TY=t.clientY;},{passive:true});
show.addEventListener("touchend",e=>{
  if(!document.body.classList.contains("showing"))return;
  const t=e.changedTouches[0],dx=t.clientX-TX,dy=t.clientY-TY;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){ e.preventDefault(); dx<0?advance():step(-1); }
},{passive:false});
window.addEventListener("beforeunload",e=>{if(dirty&&!LS_OK){e.preventDefault();e.returnValue="";}});
document.addEventListener("dragover",e=>{
  const z=e.target&&e.target.closest?e.target.closest("#shotDrop"):null;
  if(z){e.preventDefault();z.classList.add("over");}
});
document.addEventListener("dragleave",e=>{
  const z=e.target&&e.target.closest?e.target.closest("#shotDrop"):null;
  if(z) z.classList.remove("over");
});
document.addEventListener("drop",e=>{
  const z=e.target&&e.target.closest?e.target.closest("#shotDrop"):null;
  if(z&&e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]){
    e.preventDefault(); z.classList.remove("over"); shotLoad(e.dataTransfer.files[0]);
  }
});
window.addEventListener("dragover",e=>e.preventDefault());
window.addEventListener("drop",e=>e.preventDefault());

/* ゴルフ場専用版のブランディングを起動時に反映する。VENUE_CONFIG が無ければ何もしない
   （共有エンジンとしての従来動作をそのまま維持する）。 */
function applyVenueBranding(){
  const v=window.VENUE_CONFIG; if(!v) return;
  if(v.name){
    document.title=v.name+"｜CompeMaster Pro";
    const bm=document.getElementById("brandMark");
    if(bm) bm.innerHTML=v.logoUrl
      ? `<img src="${esc(v.logoUrl)}" alt="${esc(v.name)}" style="height:1.5em;vertical-align:middle">`
      : `${esc(v.name)}<b style="margin-left:.4em">CompeMaster Pro</b>`;
  }
  if(v.themeColor) document.documentElement.style.setProperty("--brass",v.themeColor);
}

(function boot(){
  applyVenueBranding();
  const a=loadAuto();
  if(a&&a.db&&a.db.meta){DB=migrate(a.db);lastAuto=a.at;restored=a.at;
    const r=recentList()[0]; if(r&&r.name===DB.meta.name) FILENAME=r.file;}
  document.body.className="work";render();
})();
/* ---- オフライン対応（httpsで配信したときだけ有効。ファイルを直接開いた場合は何もしない） ---- */
(function(){
  if(!("serviceWorker" in navigator)) return;
  if(location.protocol!=="https:" && location.hostname!=="localhost") return;
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
})();
