<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CompeMaster Pro｜ゴルフコンペ総合運営システム</title>
<meta name="theme-color" content="#081810">
<meta name="description" content="参加者・組み合わせ・スコア集計・予想ゲーム・表彰式の演出までを1つで行うコンペ運営アプリ">
<link rel="manifest" href="pc.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CompeMasterPro">
<style>
:root{
  --board:#081810; --panel:#10291E; --panel-2:#163828; --rule:#2E5944;
  --ink:#F4F1E5; --ink-dim:#93AC9D; --brass:#D9B166; --brass-dim:#8A7040; --hit:#F2D024;
  --jp:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --num:ui-monospace,"SF Mono","Menlo","Consolas","Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--board);color:var(--ink);font-family:var(--jp);-webkit-font-smoothing:antialiased}
body.work{overflow:auto} body.showing{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit}
table{border-collapse:collapse;width:100%}
/* 列数が多い表（18ホール分のスコア入力など）は、幅の狭い画面だけでなく
   .wrap の最大幅（1200px）より表の最小幅が広いときにも、カードの外へはみ出す。
   スマホ対応の横スクロールと同じ仕組みを、対象の表にだけ常時かけておく（2026-09-08）。
   別の作業で加わった修正を取り込んだもの */
.card table.hscroll{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;max-width:100%}
.grain{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:.45;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px),
  radial-gradient(120% 90% at 50% 0%,transparent 45%,rgba(0,0,0,.5) 100%)}
#work{display:none;min-height:100%;padding:0 0 90px;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
body.work #work{display:block} body.work #show,body.work #hud{display:none}
/* 当日モードの切替。ヘッダーの右端に置く。
   押すたびに「準備中」と「当日モード」が入れ替わる */
.daysw{background:transparent;border:1px solid var(--rule);color:var(--ink-dim);
  border-radius:3px;padding:7px 14px;font:inherit;font-size:12.5px;letter-spacing:.08em;
  cursor:pointer;white-space:nowrap}
.daysw:hover{border-color:var(--brass-dim);color:var(--ink)}
.daysw.on{background:var(--brass);border-color:var(--brass);color:#231A0B;font-weight:700}
.top{position:sticky;top:0;z-index:40;background:rgba(11,31,23,.96);border-bottom:1px solid var(--rule);backdrop-filter:blur(8px)}
.top .bar{max-width:1200px;margin:0 auto;padding:13px 22px 0;display:flex;align-items:baseline;gap:15px;flex-wrap:wrap}
.top h1{font-size:16px;font-weight:800;letter-spacing:.05em}
.top .sub{font-size:11px;letter-spacing:.18em;color:var(--brass)}
.top .save{margin-left:auto;font-size:11px;color:var(--ink-dim)}
.top .save b{color:var(--hit)}
.tabs{max-width:1200px;margin:0 auto;padding:9px 22px 0;display:flex;gap:2px;flex-wrap:wrap}
.tab{padding:8px 14px;font-size:12.5px;color:var(--ink-dim);border:1px solid transparent;border-bottom:none;border-radius:3px 3px 0 0}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--brass);background:var(--panel);border-color:var(--rule)}
.wrap{max-width:1200px;margin:0 auto;padding:24px 22px}
.pane{display:none} .pane.on{display:block}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:19px 21px;margin-bottom:17px}
.card h2{font-size:14px;letter-spacing:.13em;color:var(--brass);font-weight:700;padding-bottom:9px;
  border-bottom:1px solid var(--rule);margin-bottom:15px;display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
.card h2 small{font-size:11px;color:var(--ink-dim);letter-spacing:.03em;font-weight:400}
.row{display:flex;gap:13px;align-items:flex-end;flex-wrap:wrap;margin-bottom:13px}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-size:11px;letter-spacing:.09em;color:var(--ink-dim)}
.f input,.f select,.f textarea{background:var(--board);border:1px solid var(--rule);color:var(--ink);
  padding:8px 10px;border-radius:3px;min-width:92px;font-variant-numeric:tabular-nums}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--brass);outline-offset:1px}
.f input[type=number]{width:80px;text-align:center}
.f textarea{min-width:340px;font-family:var(--num);font-size:12px}
.hint{font-size:12px;color:var(--ink-dim);line-height:1.75}
.btn{padding:8px 17px;border-radius:3px;border:1px solid var(--brass);color:var(--brass);
  font-size:12px;letter-spacing:.08em;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--brass);color:var(--board)}
.btn.primary{background:var(--brass);color:var(--board);font-weight:700}
.btn.primary:hover{filter:brightness(1.12)}
.btn.ghost{border-color:var(--rule);color:var(--ink-dim)}
.btn.ghost:hover{background:var(--rule);color:var(--ink)}
.btn.warn{border-color:#a33;color:#e88} .btn.warn:hover{background:#a33;color:#fff}
th,td{border:1px solid var(--rule);padding:6px 8px;font-size:13px;text-align:left}
th{background:var(--panel-2);font-size:11px;letter-spacing:.07em;color:var(--brass);font-weight:700}
td.n,th.n{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
tr.zebra:nth-child(even) td{background:rgba(255,255,255,.02)}
tbody tr:hover td{background:rgba(217,177,102,.06)}
td input,td select{background:var(--board);border:1px solid var(--rule);color:var(--ink);padding:4px 6px;border-radius:2px;width:100%}
td input.q{width:56px;text-align:center;font-family:var(--num)}
.del{color:#c66;font-size:15px;line-height:1}.del:hover{color:#f88}
.mv{color:var(--ink-dim);font-size:11px;line-height:1;padding:1px 3px}.mv:hover{color:var(--brass)}
.handle{cursor:grab;color:var(--ink-dim);user-select:none;font-size:15px;letter-spacing:-2px}
.handle:active{cursor:grabbing}
tr.dragging td{opacity:.35}
tr.dropline td{box-shadow:inset 0 2px 0 var(--brass)}
tr.dropline.after td{box-shadow:inset 0 -2px 0 var(--brass)}
select.fsel{font-family:var(--num);font-weight:700;text-align:center;border-width:2px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-dim)}
.sw{width:14px;height:14px;border-radius:2px;display:inline-block}
.stat-row{display:flex;gap:24px;flex-wrap:wrap;background:var(--panel-2);border:1px solid var(--rule);
  border-radius:3px;padding:12px 17px;margin:10px 0}
.stat-row div{font-size:11px;color:var(--ink-dim);letter-spacing:.07em}
.stat-row b{display:block;font-family:var(--num);font-size:20px;color:var(--ink);margin-top:3px;font-weight:600}
.stat-row b.hi{color:var(--brass)} .stat-row b.warn{color:var(--hit);font-size:15px}
.chip{width:19px;height:19px;border-radius:2px;display:inline-grid;place-items:center;
  font-family:var(--num);font-size:11px;font-weight:700;vertical-align:-4px;margin-right:6px}
.msg{padding:10px 13px;border-radius:3px;font-size:12px;line-height:1.7;margin-top:9px;border:1px solid var(--rule)}
.msg.ok{border-color:#2f7d55} .msg.ng{border-color:#a33;color:#f9b} .msg.warn{border-color:var(--hit);color:var(--hit)}
.matrix td,.matrix th{text-align:center;padding:4px;font-family:var(--num);font-size:12px;min-width:32px}
.matrix td.hitc{background:var(--brass);color:var(--board);font-weight:700}
.matrix td.z{color:#3d5c4e}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:17px}
@media(max-width:880px){.grid2{grid-template-columns:1fr}}
.drop{border:1px dashed var(--rule);border-radius:4px;padding:22px;text-align:center;transition:.15s}
.drop.over{border-color:var(--brass);background:var(--panel-2)}
.shot{position:relative;border:1px solid var(--rule);border-radius:4px;background:#000;overflow:auto;max-height:52vh}
.shot img{display:block;transform-origin:top left;image-orientation:from-image}
.shot.stick{position:sticky;top:96px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.shotbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.shotbar input[type=range]{width:150px;padding:0}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}
.gcard{background:var(--board);border:1px solid var(--rule);border-radius:4px;padding:12px 14px}
.gcard.over{border-color:var(--brass);background:var(--panel-2)}
.gcard h3{font-size:13px;color:var(--brass);margin-bottom:8px;display:flex;gap:8px;align-items:baseline}
.gcard h3 input{width:78px;background:var(--panel);border:1px solid var(--rule);color:var(--ink);
  padding:2px 5px;border-radius:2px;font-family:var(--num);font-size:12px;text-align:center}
.gp{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:2px;font-size:13px;cursor:grab}
.gp:hover{background:rgba(217,177,102,.08)}
.gp.dragging{opacity:.4}
.gp .x{margin-left:auto;color:#c66;font-size:13px}
.pill{display:inline-block;padding:2px 8px;border:1px solid var(--rule);border-radius:99px;font-size:11px;color:var(--ink-dim)}
.mods{display:flex;flex-wrap:wrap;gap:9px}
.mod{display:flex;align-items:center;gap:7px;border:1px solid var(--rule);border-radius:3px;padding:8px 13px;font-size:13px}
.mod.on{border-color:var(--brass);color:var(--brass);background:var(--panel-2)}
@media print{
  body{background:#fff;color:#000}
  .grain,.top,.no-print,.btn{display:none!important}
  .card{border:1px solid #999;background:#fff;page-break-inside:avoid}
  .card h2{color:#000;border-color:#999}
  th{background:#eee;color:#000} th,td{border-color:#999}
  .gcard{border-color:#999;background:#fff} .gcard h3{color:#000}
  .stat-row{background:#f4f4f4;border-color:#999} .stat-row b{color:#000}
}
/* 発表 */
#show{position:fixed;inset:0;display:none;place-items:center;padding:4vmin}
body.showing #show{display:grid} body.showing #work{display:none}
.slide{display:none;width:100%;max-width:1500px;text-align:center}
.slide.on{display:block;animation:rise .5s cubic-bezier(.2,.8,.25,1) both}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.kicker{font-size:clamp(10px,1.1vw,14px);letter-spacing:.5em;color:var(--brass);margin-bottom:2.4vmin}
.title{font-size:clamp(22px,5.2vw,72px);font-weight:800;letter-spacing:.06em;line-height:1.25}
.sub{font-size:clamp(13px,1.6vw,21px);color:var(--ink-dim);margin-top:2.2vmin;letter-spacing:.14em}
.rule{width:74px;height:2px;background:var(--brass);margin:3.2vmin auto}
.frames{display:grid;gap:1.2vmin;margin-top:1vmin}
.frame{background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:1.4vmin 1vmin;transition:.22s}
.frame .no{width:clamp(26px,3vw,42px);height:clamp(26px,3vw,42px);border-radius:3px;display:grid;place-items:center;
  font-family:var(--num);font-weight:700;font-size:clamp(13px,1.7vw,23px);margin:0 auto .7vmin}
.frame .nm{font-size:clamp(10px,1.15vw,15px);line-height:1.55}
.frame.win{border-color:var(--brass);background:var(--panel-2);box-shadow:0 0 0 2px var(--brass),0 0 44px rgba(217,177,102,.4);transform:scale(1.05)}
.combo{display:flex;align-items:center;justify-content:center;gap:clamp(10px,2.4vw,34px);margin:1vmin 0}
.big-no{width:clamp(80px,13vw,180px);height:clamp(80px,13vw,180px);border-radius:6px;display:grid;place-items:center;
  font-family:var(--num);font-weight:700;font-size:clamp(38px,7.6vw,106px);line-height:1;box-shadow:0 12px 44px rgba(0,0,0,.5)}
/* 2026-09-20：馬連の当選発表用。氏名は枠番より長いので、正方形ではなく横長の箱にする */
.big-no.txt{width:auto;min-width:clamp(140px,22vw,300px);height:clamp(64px,9vw,110px);border-radius:10px;
  font-family:var(--jp);font-weight:700;font-size:clamp(20px,3.4vw,40px);line-height:1.15;padding:0 3vmin;
  background:var(--panel-2);color:var(--brass);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash{font-size:clamp(32px,5.6vw,80px);color:var(--brass);font-family:var(--num)}
.rolling .big-no{animation:shk .09s infinite}
@keyframes shk{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.pair-names{display:flex;justify-content:center;gap:clamp(16px,4vw,64px);font-size:clamp(12px,1.6vw,22px);
  color:var(--ink-dim);margin-top:2.4vmin;letter-spacing:.1em}
.payout{font-family:var(--num);font-size:clamp(52px,12.5vw,176px);font-weight:700;color:var(--brass);
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 0 60px rgba(217,177,102,.3)}
.payout .yen{font-size:.34em;margin-left:.14em;color:var(--ink)}
.stats{display:flex;justify-content:center;gap:clamp(20px,5vw,76px);margin-top:4vmin;flex-wrap:wrap}
.stat i{display:block;font-style:normal;font-size:clamp(9px,1vw,12px);letter-spacing:.24em;color:var(--ink-dim);margin-bottom:.8vmin}
.stat b{font-family:var(--num);font-size:clamp(18px,2.5vw,35px);font-weight:600}
.winners{display:flex;flex-wrap:wrap;justify-content:center;gap:1.1vmin;margin-top:1vmin;max-height:62vh;overflow:auto}
.winner{background:var(--panel);border:1px solid var(--brass);border-radius:3px;padding:1.3vmin 2.2vmin;
  font-size:clamp(12px,1.65vw,22px);letter-spacing:.08em;animation:pop .42s cubic-bezier(.2,.9,.3,1.3) both}
.winner em{font-style:normal;font-family:var(--num);color:var(--brass);margin-left:.7em;font-size:.82em}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(10px)}to{opacity:1;transform:none}}
.none{color:var(--ink-dim);font-size:clamp(14px,1.9vw,26px);letter-spacing:.12em}
.rank-badge{font-family:var(--num);font-size:clamp(13px,1.5vw,20px);letter-spacing:.3em;color:var(--brass);
  border:1px solid var(--brass-dim);border-radius:2px;padding:.7vmin 1.8vmin;display:inline-block;margin-bottom:3vmin}
.name-xl{font-size:clamp(28px,8.6vw,120px);font-weight:800;letter-spacing:.08em;line-height:1.15;word-break:keep-all}
.veil.hidden .name-xl{filter:blur(24px);opacity:.35}
.veil .name-xl{transition:filter .7s ease,opacity .7s ease}
.act-num{font-family:var(--num);font-size:clamp(11px,1.3vw,17px);letter-spacing:.5em;color:var(--brass)}
.act-title{font-size:clamp(34px,8.4vw,122px);font-weight:800;letter-spacing:.3em;line-height:1.1;margin-left:.3em}
.mode-box{margin-top:4vmin;opacity:0;transform:scale(.92);transition:opacity .8s,transform .8s cubic-bezier(.2,.9,.3,1.2)}
.mode-box.show{opacity:1;transform:none}
.mode-label{font-size:clamp(10px,1.1vw,14px);letter-spacing:.4em;color:var(--ink-dim);margin-bottom:1.6vmin}
.mode-word{font-size:clamp(30px,7vw,96px);font-weight:800;color:var(--brass);letter-spacing:.16em;text-shadow:0 0 60px rgba(217,177,102,.35)}
.sel-cards{display:flex;justify-content:center;gap:1.6vmin;flex-wrap:wrap;margin-top:1vmin}
.sel-card{background:var(--panel);border:1px solid var(--brass);border-radius:4px;padding:2.1vmin 2.9vmin;
  min-width:clamp(136px,18vw,232px);animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
.sel-card .rk{font-family:var(--num);font-size:clamp(10px,1.1vw,14px);letter-spacing:.3em;color:var(--brass-dim)}
.sel-card .nm{font-size:clamp(15px,2.2vw,30px);font-weight:700;letter-spacing:.06em;margin:1vmin 0}
.sel-card .vt{font-family:var(--num);font-size:clamp(11px,1.2vw,16px);color:var(--ink-dim)}
.fine-tbl{display:inline-block;text-align:left;margin-top:1vmin;max-height:56vh;overflow:auto}
.fine-row{display:flex;align-items:baseline;gap:clamp(12px,2.4vw,36px);padding:1vmin 1.9vmin;border-bottom:1px solid var(--rule);
  font-size:clamp(12px,1.55vw,21px);animation:pop .4s cubic-bezier(.2,.9,.3,1.3) both}
.fine-row .fn{min-width:clamp(92px,11vw,172px)}
.fine-row .fg{font-family:var(--num);color:var(--ink-dim);min-width:4em}
.fine-row .fa{font-family:var(--num);color:var(--hit);font-weight:700;margin-left:auto}
.hud{position:fixed;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:space-between;
  padding:14px 20px;padding-bottom:calc(14px + env(safe-area-inset-bottom));font-size:11px;
  color:var(--ink-dim);letter-spacing:.14em;z-index:50;gap:8px;flex-wrap:wrap}
.hud button{padding:8px 10px;border-radius:3px}
body.showing .hud{display:flex}
.dots{display:flex;gap:5px;flex-wrap:wrap;max-width:60%}
.dot{width:6px;height:6px;border-radius:50%;background:var(--rule);transition:.2s}
.dot.on{background:var(--brass);transform:scale(1.4)}
.hud button:hover{color:var(--brass)}
/* ========== スマホ・タブレット ========== */
html{-webkit-text-size-adjust:100%}
.tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
@media(max-width:1100px){
  .wrap,.top .bar,.tabs{padding-left:14px;padding-right:14px}
  .gcards{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .shot{max-height:44vh}.shot.stick{top:112px}
}
@media(max-width:760px){
  .wrap{padding:14px 10px 80px}
  .top .bar{padding:10px 10px 0;gap:8px}
  .top h1{font-size:15px}
  .top .sub{font-size:10px;letter-spacing:.1em}
  .top .save{flex-basis:100%;margin-left:0;font-size:10px;line-height:1.5}
  .tabs{padding:8px 10px 0;flex-wrap:nowrap}
  .tab{padding:9px 12px;font-size:12px;white-space:nowrap;flex:0 0 auto}
  .card{padding:14px 12px;margin-bottom:13px}
  .card h2{font-size:13px;letter-spacing:.08em}
  /* 表は横スクロール */
  .card table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;max-width:100%}
  th,td{padding:8px 7px;font-size:12.5px}
  /* 入力欄は画面幅に合わせる／iOSの自動ズーム防止に16px */
  input,select,textarea{font-size:16px}
  /* 表の中の氏名・受賞者・投票者は、列に下限幅を与えたうえで中身も列いっぱいに広げる。
     これが無いと 1文字ぶんまで潰れて「佐々木」が「佐々オ」に切れる
     （2026-09-04、iPhoneの参加者タブとニアピンタブで実際に起きた）。
     数字用の .q と枠の .fsel は幅を決めてあるので対象から外す */
  td>input:not([type]),td>select:not(.fsel){width:100%;min-width:0}
  td>input.q{width:56px}
  .f{flex:1 1 46%;min-width:0}
  .f input,.f select{min-width:0;width:100%}
  .f input[type=number]{width:100%}
  .f textarea{min-width:0!important;width:100%}
  .row{gap:10px}
  .row>.btn{flex:1 1 auto}
  .grid2{grid-template-columns:1fr;gap:12px}
  .gcards{grid-template-columns:1fr}
  .stat-row{gap:14px;padding:11px 13px}
  .stat-row b{font-size:17px}
  .mods{gap:7px}.mod{padding:9px 11px;font-size:12px;flex:1 1 46%}
  /* 押しやすく */
  .del,.mv{padding:7px 9px;font-size:16px;line-height:1}
  td input[type=checkbox],.mod input[type=checkbox]{transform:scale(1.3)}
  td input.q{width:56px}
  .hint{font-size:11.5px}
  .legend span{font-size:10.5px}
}
@media(max-width:520px){
  .f{flex:1 1 100%}
  .mod{flex:1 1 100%}
  .top .bar{flex-direction:column;align-items:flex-start;gap:3px}
}
/* 発表画面 */
@media(max-width:760px){

<style>

<style>
/* ===== 仕上げ：スコアカードの紙面をたどる ===== */
:root{
  --display:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",Georgia,serif;
  --rule-soft:rgba(46,89,68,.45);
  --rule-hard:#3E6E54;
  --ctl:38px;
}
.emblem,.wordmark,.brand-sub{font-family:var(--display)}
.wordmark{letter-spacing:.08em;font-size:16px}
.brand-sub{letter-spacing:.26em;font-size:8.5px}
.kicker,.act-num,.rank-badge{font-family:var(--display)}
.card::before{display:none}
.card:has(table)::before{display:block;inset:6px;border-color:rgba(217,177,102,.10)}
.card h2{letter-spacing:.1em;font-size:13.5px}
.card h2 small{font-weight:400;opacity:.85}
th,td{border-color:var(--rule-soft);border-bottom-color:var(--rule)}
th{letter-spacing:.06em;font-weight:700;padding:9px 8px;border-bottom:1.5px solid var(--rule-hard)}
td{padding:8px}
td.n,th.n{font-variant-numeric:tabular-nums}
td.n b{font-size:1.05em}
tbody tr:last-child td{border-bottom-color:var(--rule-hard)}
tbody tr:hover td{background:rgba(217,177,102,.055)}
tbody td[colspan]{color:var(--ink-dim);text-align:center;padding:22px 12px;line-height:1.8;
  background:repeating-linear-gradient(135deg,transparent 0 7px,rgba(255,255,255,.014) 7px 14px)}
.f input,.f select,.btn{min-height:var(--ctl)}
.f select,td select{appearance:none;-webkit-appearance:none;padding-right:26px;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-dim) 50%),
                   linear-gradient(135deg,var(--ink-dim) 50%,transparent 50%);
  background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.f select.fsel,td select.fsel{background-image:none;padding-right:8px}
.f label{font-size:10.5px;letter-spacing:.12em}
.f input:hover,.f select:hover{border-color:var(--brass-dim)}
.btn{display:inline-flex;align-items:center;justify-content:center;transition:.12s}
.btn:active{transform:translateY(1px)}
.btn.primary{box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 2px 8px rgba(0,0,0,.35)}
.btn.ghost{background:rgba(255,255,255,.02)}
.btn.ghost:hover{background:var(--rule);color:var(--ink);border-color:var(--rule)}
.msg{border-left-width:3px;padding-left:13px}
.msg.ok{border-left-color:#3E9B6B}
.msg.warn{border-left-color:var(--hit)}
.msg.ng{border-left-color:#C25555}
.stat-row{border-top:2px solid var(--rule-hard);border-radius:0 0 3px 3px}
.tab{border-radius:2px 2px 0 0}
.tab.on{box-shadow:inset 0 2px 0 var(--brass);border-bottom:1px solid var(--panel);margin-bottom:-1px}
.tabs{border-bottom:1px solid var(--rule)}
.chip,.sw{border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:2px}
@media(max-width:760px){
  :root{--ctl:42px}
  .card:has(table)::before{display:none}
  th,td{padding:9px 7px}
  .card h2{font-size:12.5px}
  .wordmark{font-size:14px}
  .brand-sub{display:none}
}
@media print{
  .card::before{display:none!important}
  th{background:#eee!important;border-bottom:1.5px solid #666}
  .stat-row{border-top:2px solid #666}
}
/* ---- 大会設定：基本・追加ルール・詳しく（2026-09-16、デザイン案P2・P3） ---- */
.rule-g+.rule-g{margin-top:14px}
.rule-gt{margin-bottom:7px;font:600 10.5px var(--num);letter-spacing:.12em;color:var(--ink-dim)}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mod.rcard{display:flex;flex-direction:column;align-items:stretch;gap:6px;min-height:118px;padding:14px 15px;
  background:var(--board);border:1px solid var(--rule);border-radius:14px;cursor:pointer}
.mod.rcard.on{border-color:var(--brass);background:var(--panel);color:var(--ink)}
.rule-h{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14.5px}
.rule-d{font-size:12px;line-height:1.6;color:#c9d3c8}
.mod.rcard .fn{margin-top:auto}
.tgl{appearance:none;-webkit-appearance:none;flex:0 0 auto;position:relative;width:40px;height:22px;margin:0;
  border-radius:11px;background:var(--rule);cursor:pointer;transition:background .15s}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:var(--ink-dim);transition:left .15s,background .15s}
.tgl:checked{background:var(--brass)}
.tgl:checked::after{left:20px;background:var(--board)}
@media (prefers-reduced-motion:reduce){.tgl,.tgl::after{transition:none}}
.fold-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin:26px 2px 10px}
.fold-head b{font-size:14px;letter-spacing:.08em;color:var(--brass)}
.fold-head span{font-size:12px;color:var(--ink-dim)}
.fold-head .btn{margin-left:auto}
details.fold{padding:0}
details.fold>summary{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding:15px 21px;
  cursor:pointer;list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸";color:var(--ink-dim);font-size:11px;width:10px}
details.fold[open]>summary::before{content:"▾"}
details.fold[open]>summary{border-bottom:1px solid var(--rule)}
.fold-t{font-size:14px;font-weight:700;letter-spacing:.1em;color:var(--brass)}
.fold-s{min-width:0;font-size:12.5px;color:var(--ink-dim)}
.fold-w{margin-left:auto;padding:2px 9px;border:1px solid var(--hit);border-radius:999px;font-size:11px;color:var(--hit);white-space:nowrap}
.fold-b{padding:17px 21px 19px}
.fold-b>.card{margin:0 0 16px;padding:0;background:none;border:none}
.fold-b>.card::before{display:none}
.fold-b>.card:last-child{margin-bottom:0}
.fold-h3{margin:16px 0 8px;font-size:12.5px;letter-spacing:.1em;color:var(--ink-dim)}
.fold-h3:first-child{margin-top:0}
@media print{details.fold>summary::before{display:none}}
/* ---- 検算エラーカード・同点の注記（2026-09-16、デザイン案P7・P8） ---- */
.ngc{margin-top:10px;padding:13px 15px;border:1px solid #ff7f7f;border-radius:12px;font-size:13.5px;line-height:1.7}
.ngc-v{font-family:var(--num);color:var(--brass)}
.ngc-a{display:flex;flex-wrap:wrap;gap:8px;margin:9px 0 4px}
tr.ngrow td{background:rgba(255,127,127,.07)}
tr.tie td{text-align:left;padding:5px 12px;font-size:11.5px;color:#6f8a78;background:none;border-top:none}
.tie-note{margin-top:8px}
/* ---- スマホの集金カード（2026-09-17） ---- */
.pay-cards{display:none}
@media screen and (max-width:760px){
  .pay-cards{display:block}
  .card table.pay-table{display:none}
  .pay-sum{position:sticky;bottom:calc(68px + env(safe-area-inset-bottom));z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;
    margin:12px -2px 0;padding:12px 14px;background:var(--panel);border:1px solid var(--brass-dim);border-radius:14px;
    box-shadow:0 -6px 18px rgba(0,0,0,.45)}
  .pay-d .nw{white-space:nowrap}
  .pay-sum>div{display:flex;flex-direction:column}
  .pay-sum b{font-family:var(--num);font-size:22px;line-height:1.1}
  .pay-sum b span{font-size:13px;color:var(--ink-dim)}
  .pay-sum small{font-size:11px;color:var(--ink-dim)}
  .pay-rest{color:var(--hit)}
  .pay-only{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:12.5px;min-height:44px}
  .pay-c{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;
    width:100%;min-height:64px;margin-bottom:8px;padding:12px 14px;text-align:left;color:var(--ink);
    background:var(--board);border:1px solid var(--rule);border-radius:14px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .08s}
  .pay-c:active{transform:scale(.98);background:var(--panel-2)}
  .pay-ck{display:grid;place-items:center;width:30px;height:30px;border:2px solid var(--ink-dim);border-radius:8px;
    font-size:19px;font-weight:800;line-height:1}
  /* 受け取り済みは、ひと目で分かるよう地の色・枠・印をすべて変える */
  .pay-c.got{background:rgba(217,177,102,.16);border:2px solid var(--brass);padding:11px 13px}
  .pay-c.got .pay-ck{background:var(--brass);border-color:var(--brass);color:var(--board)}
  .pay-c.got .pay-d{color:var(--ink-dim)}
  .pay-m{display:flex;flex-direction:column;gap:3px;min-width:0}
  .pay-h b{font-size:15.5px}
  .pay-d{font-size:11.5px;line-height:1.5;color:#c9d3c8;overflow-wrap:anywhere}
  .pay-y{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
  .pay-y b{font-family:var(--num);font-size:19px}
  .pay-y small{font-size:10.5px;color:var(--ink-dim)}
  .pay-ok{padding:2px 8px;border-radius:999px;background:var(--brass);color:var(--board);font-size:10.5px;font-weight:700;white-space:nowrap}
}
@media print{.pay-cards{display:none!important}}
/* ---- 集金のあとの差額（2026-09-18、v55） ----
   受け取ったあとで金額が変わった方は、済み（金）と未（無地）のどちらでもない3つめの見た目にする。
   追加でいただく額は黄、お返しする額は緑。チェックの印は △ */
.pay-c.dif{background:rgba(242,208,36,.07);border:2px dashed var(--hit);padding:11px 13px}
.pay-c.dif .pay-ck{background:none;border-color:var(--hit);color:var(--hit)}
.pay-c.dif .pay-d{color:#c9d3c8}
.pay-c.dif .pay-why{color:var(--hit)}
.pay-c.dif.out{border-color:#8fd3a8;background:rgba(143,211,168,.07)}
.pay-c.dif.out .pay-ck,.pay-c.dif.out .pay-why{border-color:#8fd3a8;color:#8fd3a8}
.pay-c.dif.out .pay-y b{color:#8fd3a8}
.pay-dt{padding:2px 8px;border-radius:999px;border:1px solid currentColor;color:var(--hit);font-size:10.5px;font-weight:700;white-space:nowrap}
.pay-c.dif.out .pay-dt{color:#8fd3a8}
.pay-dl{margin:7px 0 7px 1.3em;color:var(--ink)}
.pay-dl li{margin:3px 0}
.pay-dl small{color:var(--ink-dim)}
.pay-dv{font-family:var(--num);font-weight:700;white-space:nowrap}
.pay-dv.in{color:var(--hit)} .pay-dv.out{color:#8fd3a8}
.pay-dmk{color:var(--hit);font-weight:800;font-size:15px}
tr.zebra.pay-drow td{background:rgba(242,208,36,.06)}
.pay-dh{color:var(--hit)}
.pay-dbt{padding:5px 10px;min-height:34px;border-radius:6px;border:1px solid var(--hit);color:var(--hit);
  font-family:var(--num);font-size:12px;white-space:nowrap}
.pay-dbt.out{border-color:#8fd3a8;color:#8fd3a8}
.pay-cv{color:var(--ink-dim);font-size:10.5px}
.cx-card{margin-top:12px}
.cx-card>summary{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;cursor:pointer;list-style:none;min-height:24px}
.cx-card>summary::-webkit-details-marker{display:none}
.cx-card>summary::before{content:"▸";color:var(--ink-dim);font-size:11px;width:10px}
.cx-card[open]>summary::before{content:"▾"}
.cx-t{font-size:14px;font-weight:700;letter-spacing:.1em;color:var(--brass)}
.cx-s{font-size:12.5px;color:var(--ink-dim)}
.cx-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(15em,1fr));gap:8px 18px}
.cx-row{display:flex;align-items:center;gap:8px;min-width:0}
.cx-n{flex:1;min-width:0;overflow-wrap:anywhere}
.cx-row input{width:7.5em;min-height:40px;padding:4px 8px;text-align:right;font-family:var(--num);
  background:var(--board);border:1px solid var(--rule);border-radius:2px;color:var(--ink)}
@media print{.pay-dbt,.pay-dbt.out{border:none;padding:0;min-height:0;color:#000;font-size:inherit}.pay-da{display:none}.pay-dh,.pay-dmk{color:#000}tr.zebra.pay-drow td{background:none}}
/* 集金表の印刷（v55で直した。v54以前から）。画面用の横スクロール（hscroll）のまま紙に出していたため、
   A4縦では徴収額より右（賞金・払戻・罰金・お渡し）が切れていた。紙では表として組み、列の最小幅を外して字を詰める。
   表がカードごと次のページへ送られて1枚目が空くので、このカードだけはページをまたいでよい（行は分けない） */
@media print{.card table.pay-table{display:table;max-width:none;white-space:normal}
  .card table.pay-table th,.card table.pay-table td{min-width:0!important;padding:3px 2px;font-size:9px;letter-spacing:0}
  .card table.pay-table td input[type=checkbox]{transform:none}
  .card table.pay-table td,.card table.pay-table th{color:#000!important}
  #sec-collect{page-break-inside:auto;break-inside:auto}}
/* ---- 画面の骨格：サイドバー・見出し・下タブ・大会ハブ（2026-09-17、デザイン案の段階2） ---- */
.side,.btm{display:none}
.pghead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin:0 2px 14px}
.pg-t{margin:0;font-size:24px;font-weight:700;letter-spacing:.02em;color:var(--ink)}
.pg-m{font-size:12.5px;color:var(--ink-dim)}
@media screen and (min-width:1024px){
  /* 作業画面は body.work #work{display:block} で出しているので、同じ強さで上書きする */
  body.work #work{display:grid;grid-template-columns:236px minmax(0,1fr);align-items:start}
  .side{display:flex;flex-direction:column;grid-column:1;grid-row:1/span 2;align-self:stretch;
    min-height:100vh;padding:18px 12px 16px;background:#0a1d13;border-right:1px solid var(--rule)}
  #work>.top,#work>.wrap{grid-column:2}
  #work>.top .tabs,#work>.top .brand,#work>.top .vr,#work>.top #hdTitle{display:none}
  #work>.top .bar{justify-content:flex-end}
  .sd-brand{display:block;padding:4px 10px 16px;text-align:left}
  .sd-file{display:flex;flex-direction:column;gap:2px;margin:0 2px 14px;padding:10px 12px;background:var(--panel);
    border:1px solid var(--rule);border-radius:12px}
  .sd-file small{font:600 10px var(--num);letter-spacing:.12em;color:var(--ink-dim)}
  .sd-file b{font-size:13.5px;line-height:1.4}
  .sd-file span{font-size:11px;color:var(--ink-dim)}
  .sd-file code{overflow:hidden;font:10.5px var(--num);color:var(--ink-dim);text-overflow:ellipsis;white-space:nowrap}
  .sd-g{margin-top:14px}
  .sd-h{display:flex;align-items:center;justify-content:space-between;padding:0 8px 6px;
    font:600 10.5px var(--num);letter-spacing:.12em;color:var(--ink-dim)}
  .sd-g.now .sd-h{color:var(--brass)}
  .sd-close{color:var(--ink-dim);font-size:11px;padding:0 4px}
  .sd-i{display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;
    min-height:38px;padding:7px 10px;border-radius:9px;text-align:left;font-size:13.5px;color:#c9d3c8}
  .sd-i:hover{background:var(--panel)}
  .sd-i.on{background:var(--panel-2);color:var(--ink);box-shadow:inset 3px 0 0 var(--brass)}
  .sd-i i{display:grid;place-items:center;width:18px;height:18px;border:1.5px solid var(--rule);border-radius:50%;
    font-style:normal;font-size:10px;color:var(--brass)}
  .sd-i.ok i{background:var(--panel-2);border-color:var(--panel-2)}
  .sd-i.part i{border-color:var(--hit)}
  .sd-i.part small{color:var(--hit)}
  .sd-i.sd-hub i{border:none;font-size:18px}
  .sd-i small{font:600 11px var(--num);color:var(--ink-dim)}
  .sd-i .nw{margin-left:6px;font:600 9.5px var(--num);font-style:normal;color:var(--brass)}
  .sd-fold{display:block;width:100%;margin-top:12px;padding:8px 10px;text-align:left;font-size:12.5px;color:var(--ink-dim);
    background:var(--board);border:1px solid var(--rule);border-radius:9px}
  .sd-fold:hover{color:var(--ink);border-color:var(--brass-dim)}
  .sd-foot{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--rule)}
  .sd-l{min-height:32px;font-size:12.5px;color:var(--ink-dim)}
  .sd-l:hover,.sd-l.on{color:var(--brass)}
  /* ---- 1本のスクロール（2026-09-18、v57） ----
     v56まではサイドバーを画面に固定し、本文と別にスクロールさせていた。背の低い画面では
     サイドバーが画面の高さを超え、明るいスクロールバーが白い枠のように出る・足元の「ホーム」が隠れる・項目が折れる、が起きた。
     v56で見た目は抑えたが、原因は「左右を別々にスクロールさせる作り」そのもの。
     実際に使って「深くスクロールしても使いにくくない」と確かめたうえで（9/18）、サイドバーも上の帯も本文と一緒に流す。
     サイドバーの地の色は本文の高さまで伸ばし（align-self:stretch）、足元は一覧のすぐ下に置く */
  .sd-foot{margin-top:18px}
  /* 下の余白（スマホの下タブのぶん）は本文の側に持たせ、サイドバーの地の色をページの下端まで届かせる */
  body.work #work{padding-bottom:0}
  #work>.wrap{padding-bottom:56px}
}

   （Chromeなどの印刷エンジンがgrid/flexコンテナのページ分割を苦手とするための不具合。2026-09-20）。
   印刷では通常のブロック表示に戻し、本文が複数ページへ普通に流れるようにする */
@media print{body.work #work{display:block!important}
  #work>.top,#work>.wrap{grid-column:auto}}
/* html,body{height:100%} → #work{min-height:100%} という%指定の連鎖が、印刷では
   本文の高さに関係なく「用紙1枚ぶんの空白」を強制していた（見出しの次が丸ごと
   白紙になり、本文が2枚目から始まっていた原因はこちら。2026-09-20）。

@media print{html,body{height:auto}#work{min-height:0}}

        startAt:"",startGap:7,

      dayMode:false,

  keiba:[], gto:[], near:[], nearAny:[], drako:[], scores:{}, paid:{}, courses:[],
  result:{frame:"",top2:["",""],low:["","",""],gross:{},sel:["","",""],lucky:[]}

let DB=blank(), dirty=false, TAB="home";

const nz=s=>String(s==null?"":s).replace(/[\s\u3000]/g,"");
const yen=v=>Number(v||0).toLocaleString("ja-JP");
const fl=v=>Math.floor(v/100)*100;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const U=k=>DB.meta.use[k];
const RUN=()=>DB.players.filter(p=>+p.f>0);
const VOT=()=>DB.players.filter(p=>p.vote);
const FRAMES=()=>[...new Set(RUN().map(p=>+p.f))].sort((a,b)=>a-b);
const inFrame=f=>RUN().filter(p=>+p.f===+f).map(p=>p.n);
const inGroup=g=>DB.players.filter(p=>+p.g===+g);
const JRA={1:["#FFFFFF","#111"],2:["#1A1A1A","#fff"],3:["#D0121B","#fff"],4:["#1B5FBF","#fff"],
           5:["#F2D024","#111"],6:["#009944","#fff"],7:["#F08300","#111"],8:["#F5A3B5","#111"]};
const FC=n=>!n?{bg:"#4A5A52",fg:"#F2EFE6"}
  :(JRA[n]?{bg:JRA[n][0],fg:JRA[n][1]}:{bg:"hsl("+(n*53%360)+" 52% 42%)",fg:"#fff"});
const chip=f=>`<span class="chip" style="background:${FC(f).bg};color:${FC(f).fg}">${f||"—"}</span>`;
const ck=(a,b)=>Math.min(a,b)+"-"+Math.max(a,b);
/* 2026-09-20：馬連（氏名2名の組合せ、順不同）の的中判定キー。枠連の ck() の氏名版 */
const ckN=(a,b)=>[nz(a),nz(b)].sort().join("／");

/* ---- 自動保存 ----
   V1（2026-09-28、M0）：端末に残すものはすべて「cmp1.」で始め、ゴルフ場専用版では末尾に施設スラッグを付ける。
   ・v68（社内版）のキー golfCompe.* と混ざらない（同じ端末で両方を開いても、互いの大会を読み込まない）
   ・ゴルフ場ごとにも混ざらない。v68 では自動保存だけが分かれていて、世代の控え（GKEY）と
     最近のファイル（RKEY）はゴルフ場が違っても同じキーを共有していた。V1 では3つとも KSFX で分ける */
const KSFX=(window.VENUE_CONFIG&&window.VENUE_CONFIG.slug?("."+window.VENUE_CONFIG.slug):"");
const LSKEY="cmp1.autosave"+KSFX;
let LS_OK=(()=>{try{localStorage.setItem("__t","1");localStorage.removeItem("__t");return true;}catch(e){return false;}})();
let lastAuto=null,saveTimer=null,restored=false;
const hhmm=t=>new Date(t).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
function autoSave(){
  if(!LS_OK)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{localStorage.setItem(LSKEY,JSON.stringify({at:Date.now(),db:DB}));lastAuto=Date.now();paintSave();maybeAutoGen();}
    catch(e){LS_OK=false;paintSave();}},400);
}
function loadAuto(){if(!LS_OK)return null;try{const r=localStorage.getItem(LSKEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function clearAuto(){if(!confirm("この端末に残っている自動保存を消します。よろしいですか。"))return;
  try{localStorage.removeItem(LSKEY);}catch(e){}lastAuto=null;restored=false;paintSave();render();}
/* 「大会を丸ごと置き換えても惜しくないか」の判定。参加者・馬券・GTOのどれかに
   実データがあれば「惜しい」とみなす。newCompe/copyPrev/wipe/upJsonで共通に使う（2026-09-21） */
const hasRealData=()=>DB.players.some(p=>nz(p.n))||DB.keiba.length>0||DB.gto.length>0;
/* ---- 自動保存の世代管理（2026-09-21） ----
   上のLSKEY（v2）はこれまで通り「直近の作業内容」を1件だけ、入力のたびに上書きする
   （挙動は変えない。復元テスト・起動時の自動復元は従来のまま）。
   これとは別に、以下の2つの場面で「世代」を最大3件まで積み増す。
     ・前回の世代保存から5分以上経っていて、かつ実データがある（時間による保険）
     ・大会をまるごと置き換える操作（読み込み・新規作成・全消去）の直前（事故防止の保険）
   通常の自動保存とはキーを分け、失敗しても本来の自動保存には影響させない。 */
const GKEY="cmp1.gens"+KSFX;
let lastGenAt=0;
function loadGens(){if(!LS_OK)return [];try{const r=JSON.parse(localStorage.getItem(GKEY)||"[]");return Array.isArray(r)?r:[];}catch(e){return [];}}
function pushGen(){
  if(!LS_OK||!hasRealData())return;
  try{
    const gens=loadGens();
    gens.unshift({at:Date.now(),db:JSON.parse(JSON.stringify(DB))});
    localStorage.setItem(GKEY,JSON.stringify(gens.slice(0,3)));
    lastGenAt=Date.now();
  }catch(e){/* 容量不足等はあきらめる。通常の自動保存（LSKEY）には影響しない */}
}
function maybeAutoGen(){ if(Date.now()-lastGenAt>=300000) pushGen(); }
function restoreGen(i){
  const gens=loadGens(),g=gens[i]; if(!g) return;
  const nm=(g.db&&g.db.meta&&g.db.meta.name)||"この大会";
  if(!confirm('"'+nm+'"（'+hhmm(g.at)+'時点の控え）に戻します。\n今の内容は失われます。よろしいですか。'))return;
  DB=migrate(g.db);dirty=false;restored=false;NOTE="";TAB="hub";autoSave();render();
}
function clearGens(){
  if(!confirm("保存されている過去の状態の控えをすべて消します。よろしいですか。"))return;
  try{localStorage.removeItem(GKEY);}catch(e){}render();
}
/* 保存の状態。まだ一度も自動保存していないときの文言が、
   予想入力の空欄の文言（まだ投票がありません…）になっていたのを直した（2026-09-16） */
function paintSave(){
  const el=document.getElementById("saveState");if(!el)return;
  el.innerHTML=!LS_OK?(dirty?'<b>自動保存が使えません。「データ」タブで保存を</b>':"このブラウザでは自動保存が使えません")
    :(lastAuto?'<i class="sv-dot"></i>自動保存 '+hhmm(lastAuto)+'<span class="sv-sub">　／ 終了前にファイル保存を</span>'
              :'自動保存はまだありません<span class="sv-sub">　／ 入力すると保存されます</span>');
}
const touch=()=>{dirty=true;autoSave();paintSave();};

/* ================= スコア集計（ペリア方式） ================= */
const SC=()=>DB.meta.sc;
const coursePar=()=>SC().par.reduce((a,b)=>a+b,0);
const hiddenN=()=>SC().system==="new"?6:12;
const capOf=h=>{const p=SC().par[h-1]||4,c=SC().cut;
  return c==="none"?99:(c==="doublePar"?p*2:(c==="tripleBogey"?p+3:p*3));};
const ENT=()=>SC().entry||(SC().allHoles?"all":"hidden");
/* 実力の目安（前年のスコアなど）。枠を拮抗させるときだけ使い、
   順位や賞金の計算には一切使わない。空欄でも構わない */
const skillOf=p=>(p.skill===""||p.skill===undefined||p.skill===null)?null:+p.skill;
function scoreOf(n){const s=DB.scores[n]||(DB.scores[n]={h:{},gross:"",hc:"",netRef:"",hcOver:"",nc:false});
  if(s.hc===undefined)s.hc="";
  /* netRef は集計表に印字されたネット。順位の計算には使わず、打ち間違いの検算だけに使う */
  if(s.netRef===undefined)s.netRef="";
  /* hcOver（2026-09-18）：隠しホールが分からない方のために、ハンディを直接入れる欄。
     入れた値は「本来のハンディ」として扱い、上限の判定も計算のときと同じにする。
     nc（2026-09-18）：棄権・ノーカードの印。空欄（これから入れる）と区別するために持つ。
     どちらも項目の追加だけなので、古いファイルはそのまま開ける */
  if(s.hcOver===undefined)s.hcOver="";
  if(s.nc===undefined)s.nc=false;
  return s;}
/* 棄権・ノーカード。順位・GTOの下位3名・罰金のどれからも外す（入力漏れではないと明示するための印） */
const ncOf=p=>!!scoreOf(typeof p==="string"?p:p.n).nc;
function grossOf(p){
  const s=scoreOf(p.n);
  if(s.nc) return null;
  if(ENT()==="all"){
    const v=SC().par.map((_,i)=>+s.h[i+1]||0);
    if(v.every(x=>x>0)) return v.reduce((a,b)=>a+b,0);
    /* 18ホール方式でも、ホールがそろわない方はグロスを直接入れられる（2026-09-18） */
    return nz(s.gross)?+s.gross:null;
  }
  return s.gross===""||s.gross===undefined?null:+s.gross;
}
function hcOf(p){
  if(ncOf(p)) return null;
  if(ENT()==="sheet"){const v=scoreOf(p.n).hc;return v===""||v===undefined?null:+v;}
  if(SC().system==="none") return 0;
  const s=scoreOf(p.n),hs=SC().hidden.slice(0,hiddenN());
  /* 直接入れたハンディがあればそれを使う（隠しホールが分からない方の逃げ道） */
  if(nz(s.hcOver)){ let hc=Math.max(0,Math.round(+s.hcOver*10)/10); if(hcCapped()) hc=Math.min(hc,+SC().hcMax); return hc; }
  if(!hs.length) return null;
  let sum=0;
  for(const h of hs){
    const v=+s.h[h];
    if(!v) return null;
    sum+=Math.min(v,capOf(h));
  }
  const mult=SC().system==="new"?3:1.5;
  let hc=(sum*mult-coursePar())*0.8;
  hc=Math.max(0,Math.round(hc*10)/10);
  if(hcCapped()) hc=Math.min(hc,+SC().hcMax);
  return hc;
}
const hcCapped=()=>SC().hcUse!==false && +SC().hcMax>0;
const hcRaw=p=>{
  if(ncOf(p)) return null;
  if(ENT()==="sheet") return hcOf(p);
  if(SC().system==="none") return 0;
  const s=scoreOf(p.n),hs=SC().hidden.slice(0,hiddenN());
  if(nz(s.hcOver)) return Math.max(0,Math.round(+s.hcOver*10)/10);
  if(!hs.length) return null;
  let sum=0;
  for(const h of hs){const v=+s.h[h]; if(!v) return null; sum+=Math.min(v,capOf(h));}
  const hc=(sum*(SC().system==="new"?3:1.5)-coursePar())*0.8;
  return Math.max(0,Math.round(hc*10)/10);
};
function ageRank(p){
  if(!p.bd) return 9e9;
  const t=Date.parse(String(p.bd).replace(/[.\/]/g,"-"));
  return isNaN(t)?9e9:t;
}
function tieCmp(a,b){
  const t=SC().tiebreak;
  if(t==="older") return ageRank(a)-ageRank(b);
  if(t==="younger") return ageRank(b)-ageRank(a);
  if(t==="lowhc") return ((hcOf(a)??99)-(hcOf(b)??99));
  return 0;
}
function standings(){
  const rows=RUN().map(p=>{
    const g=grossOf(p),hc=hcOf(p);
    return {p,n:p.n,g,hc,net:(g!==null&&hc!==null)?Math.round((g-hc)*10)/10:null};
  });
  const done=rows.filter(r=>r.net!==null).sort((a,b)=>a.net-b.net||tieCmp(a.p,b.p));
  done.forEach((r,i)=>r.rank=i+1);
  const byG=rows.filter(r=>r.g!==null).sort((a,b)=>a.g-b.g||tieCmp(a.p,b.p));
  byG.forEach((r,i)=>r.grank=i+1);
  return {rows,net:done,gross:byG,
    best:byG[0]||null,
    worst3:byG.slice().reverse().slice(0,3)};
}

/* ================= ゴルフ場マスタ ================= */
/* ---- ゴルフ場マスタ（全国版・2026-09-08） ----
   全47都道府県 2,254施設 5,122コース。楽天GORA を主、GDO を補完として収集。
   収集の手順と限界は、リポジトリの HANDOVER.md と収集ルールのメモに記載。

   1施設1行の圧縮形で持つ。[都道府県の番号, ゴルフ場名, "コース名:パー9桁|…", 1]
   末尾の 1 は全コースが閉鎖表記の施設（235件）。パーを配列でなく9桁の文字列に、
   都道府県を番号にすることで、同じ内容が 317KB → 200KB に収まる（バイト数）。
   読み込み時に一度だけ展開し、以降の扱いは従来どおり。

   H1〜H9は「そのコースの1本目〜9本目」。INコースでも先頭が10番ホール。
   パー6・パー7のホールが6コースある（出典どおり）。トリプルパーカットの

/* ゴルフ場専用版では、自コースをあらかじめ選択済みにする（検索し直さなくてよい）。

if(window.VENUE_CONFIG&&window.VENUE_CONFIG.courseId){
  CRS.club=window.VENUE_CONFIG.courseId;
  if(typeof window.VENUE_CONFIG.courseFrontIdx==="number") CRS.a=window.VENUE_CONFIG.courseFrontIdx;
  if(typeof window.VENUE_CONFIG.courseBackIdx==="number") CRS.b=window.VENUE_CONFIG.courseBackIdx;

const mPrefs=()=>[...new Set(MASTER.map(x=>x.p))];

  return MASTER.filter(x=>(!CRS.pref||x.p===CRS.pref)&&(!q||x.k.includes(q)));};
const mClub=()=>MASTER.find(x=>x.c===CRS.club)||null;

function mFix(){
  const c=mClub();
  if(!c){CRS.a=0;CRS.b=1;return;}
  const L=c.n.length;
  if(!(CRS.a>=0&&CRS.a<L)) CRS.a=0;
  if(!(CRS.b>=0&&CRS.b<L)) CRS.b=Math.min(1,L-1);

function mSet(k,v){
  if(k==="a"||k==="b"){ CRS[k]=+v; mFix(); render(); return; }
  const prev=CRS.club;
  CRS[k]=v;
  if(k==="pref"){ const l=mClubs(); if(CRS.club&&!l.some(x=>x.c===CRS.club)) CRS.club=(l.length===1?l[0].c:""); }
  if(CRS.club!==prev){ CRS.a=0; CRS.b=1; }
  mFix(); render();
}
/* 探すときの表記ゆれを吸収する
   全角/半角・ひらがな/カタカナ・濁点の有無・長音や中黒・大文字小文字を同じ扱いにします */
function key(t){
  return String(t||"").normalize("NFKC")
    .replace(/[\s\u3000ー・]/g,"")
    .replace(/[\u3041-\u3096]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60))
    .normalize("NFD").replace(/[\u3099\u309A]/g,"")
    .toUpperCase();
}
function clubOptions(list){

    ? `<option selected>${esc(cur.c)}</option><option disabled>──ここから検索結果──</option>` : "";
  return '<option value="">（選んでください）</option>'+head
    +list.map(c=>`<option ${CRS.club===c.c?"selected":""}>${esc(c.c)}</option>`).join("");

function parsePar(text){
  const nums=(tidy(text).match(/\d+/g)||[]).map(Number);
  let par=nums.filter(v=>v>=3&&v<=6);
  let note="";
  if(par.length>18){
    /* ホール番号1〜18が混ざっている並びを除く */
    const noHole=[];
    for(let i=0;i<nums.length;i++){
      if(nums[i]>=1&&nums[i]<=18&&nums[i+1]>=3&&nums[i+1]<=6&&(i%2===0)) continue;
      noHole.push(nums[i]);
    }
    const p2=noHole.filter(v=>v>=3&&v<=6);
    if(p2.length>=18&&p2.length<par.length){par=p2;note="ホール番号らしき数字を除きました。";}
  }
  return {par:par.slice(0,18),n:par.length,note};
}

     play  … プレーする人（p.fee!==false。予想のみ・当日キャンセルの人は外れる）

const PAYTO=[["play","プレーする人"],["party","懇親会に出る人"],["stay","宿泊する人"],["all","全員"]];

const payersOf=x=>DB.players.filter(p=>payTo(x,p));

const roundUnit=()=>+BG().roundUnit||0;

/* ---- キャンセル料（2026-09-18、v55） ----

const cancelOf=p=>(p.fee===false)?Math.max(0,+p.cancel||0):0;

const nineSum=(p,back)=>{const s=scoreOf(p.n);let t=0;
  for(let i=(back?9:0);i<(back?18:9);i++){const v=+s.h[i+1];if(!v)return null;t+=v;}
  return t;};

function rankWinner(r,st){
  if(r.kind==="best") return st.best?st.best.n:"";
  if(r.kind==="oldest")   return pickBy(p=>ageRank(p)===9e9?null:ageRank(p),(a,b)=>a-b);
  if(r.kind==="youngest") return pickBy(p=>ageRank(p)===9e9?null:ageRank(p),(a,b)=>b-a);
  if(r.kind==="bestOut")  return pickBy(p=>nineSum(p,false),(a,b)=>a-b);
  if(r.kind==="bestIn")   return pickBy(p=>nineSum(p,true),(a,b)=>a-b);
  if(r.kind==="maxhc")    return pickBy(p=>hcOf(p),(a,b)=>b-a);
  /* 2026-09-20：大波・小波（前後半の差が最大／最小）・おしどり（差がゼロ）・早出（組のスタート時刻が最速） */
  if(r.kind==="bigWave")   return pickBy(p=>waveOf(p),(a,b)=>b-a);
  if(r.kind==="smallWave") return pickBy(p=>waveOf(p),(a,b)=>a-b);
  if(r.kind==="pair")      return pickBy(p=>waveOf(p)===0?0:null,(a,b)=>0);
  if(r.kind==="earliest")  return pickBy(p=>startOf(p),(a,b)=>a-b);
  if(r.kind==="last"){const i=st.net.length-(+r.n||1);return i>=0&&st.net[i]?st.net[i].n:"";}

/* 2026-09-20：イーグル・バーディー賞。ニアピン・ドラコンと違い対象ホールを決め打ちできず、
   同じ大会で複数ホール・複数人が該当しうるので、手入力（DB[key]）ではなくホール別グロスから毎回自動で出す。
   18ホールの内訳（大波・小波・おしどりと同じ前提）が無ければ対象外にする */
function birdieRows(){
  const par=SC().par; if(!Array.isArray(par)||par.length!==18) return [];
  const out=[];
  RUN().forEach(p=>{const s=scoreOf(p.n);
    for(let h=1;h<=18;h++){const v=+s.h[h]; if(!v) continue;
      const diff=v-par[h-1];
      if(diff<=-2) out.push({n:p.n,hole:h,label:"イーグル",gross:v});
      else if(diff===-1) out.push({n:p.n,hole:h,label:"バーディー",gross:v});}});
  return out.sort((a,b)=>a.hole-b.hole||nz(a.n).localeCompare(nz(b.n)));
}
/* ---- 賞品（V1・M1、原則 R3。SPEC-V1.md 4.5） ----
   賞は品物。品名（item）と出どころ（src）で持ち、賞ごとの金額は持たない。
   主催者が買う賞品の費用は、経費の「賞品購入費」（kind:"prize"）の総額でだけ扱う。
   順位賞は PZ().rank[] の各行に、技能賞・団体賞・ラッキー賞・バーディー賞は PZ().gift[key] に持つ */
const SRC=[["host","主催者の購入"],["venue","ゴルフ場の提供"],["sponsor","協賛"]];
const srcLabel=v=>(SRC.find(x=>x[0]===v)||SRC[0])[1];
const GIFTKEYS=["near","nearAny","drako","birdie","eagle","team","lucky"];
const giftOf=key=>{const P=PZ();if(!P.gift||typeof P.gift!=="object")P.gift={};
  const g=P.gift[key];
  if(!g||typeof g!=="object") P.gift[key]={item:"",src:"host"};
  return P.gift[key];};
/* 画面に出す品名。未入力なら「賞品」とだけ出す（金額は出さない） */
const itemText=o=>(o&&nz(o.item))?o.item:"賞品";
/* その人がもらう賞の一覧 [[賞の名前, 品名], …] */
function giftsOf(name){

  skillRows().forEach(r=>r.list.forEach(x=>{if(x.who&&nz(x.who)===nz(name))out.push([r.label,itemText(r.gift)]);}));

/* ---- 賞品購入費の上限（V1・M1、SPEC-V1.md 3.3） ----
   上限は1人あたり。既定値は弁護士の確認待ちのため空欄。賞品購入費の項目に金額が入っていて
   上限が空欄なら、入れるよう促す。上限を超える額は入力の時点で受け付けない（cEdit） */
const prizeItems=()=>(BG().collect||[]).filter(x=>x.kind==="prize");
const prizeCapOf=()=>{const c=BG().prizeCap;return (c===""||c===undefined||c===null)?null:(+c||0);};
const prizeEachOf=()=>prizeItems().reduce((a,x)=>a+itemEach(x),0);

function budget(){
  /* V1（M1）：収支は経費の預かりと支払いだけ。賞金の原資・予想の残金・罰金・賞金の支出は無い。
     預かった経費はそのまま払う（収入と支出に同額を立てて相殺する。片方だけだと黒字赤字が狂う） */
  const ST=settle();
  const inc=[],exp=[];
  const cars=carCount();
  (BG().collect||[]).forEach(x=>{
    const pay=payersOf(x), v=collectEach(x,pay.length||1)*pay.length;
    if(!v) return;
    const lab=x.label||"経費";
    inc.push({l:lab+"の預かり（"+pay.length+"名）",v});
    /* 行き先：1台あたりの項目は配車した担当へ、賞品購入費は賞品の購入へ、ほかは支払い先へ */
    if(x.mode==="unit"){ const back=(+x.amt||0)*cars; exp.push({l:lab+"（配車した担当へ返す）",v:back});
      if(v-back>0) exp.push({l:lab+"（頭割りの端数）",v:v-back}); }
    else exp.push({l:(x.kind==="prize"?"賞品の購入（"+lab+"）":lab+"の支払い"),v});
  });
  /* キャンセル料も預かってそのままゴルフ場へ払う（v55） */
  const cx=ST.filter(x=>x.cancel), cxSum=cx.reduce((a,x)=>a+x.cancel,0);
  if(cxSum){ inc.push({l:"キャンセル料の預かり（"+cx.length+"名）",v:cxSum}); exp.push({l:"ゴルフ場へのキャンセル料",v:cxSum}); }
  /* 切り上げたぶんは繰越金として積む。幹事の取り分ではない */
  const rnd=ST.reduce((a,x)=>a+(x.roundUp||0),0);
  if(rnd) inc.push({l:"端数の繰越（"+yen(roundUnit())+"円単位に切り上げ）",v:rnd});
  (BG().income||[]).forEach(x=>inc.push({l:x.label||"その他収入",v:+x.amt||0}));
  /* 追加でいただく差額を繰越金で埋めたぶん（v55） */
  const cov=ST.reduce((a,x)=>a+(x.cover||0),0);
  if(cov) exp.push({l:"差額の穴埋め（繰越金から）",v:cov});
  (BG().expense||[]).forEach(x=>exp.push({l:x.label||"その他支出",v:+x.amt||0}));
  const ti=inc.reduce((a,b)=>a+b.v,0),te=exp.reduce((a,b)=>a+b.v,0);
  return {inc,exp,income:ti,expense:te,diff:ti-te};
}
function settle(){
  /* V1（M1）：精算は経費だけ。配当・払戻・賞金・罰金は無い（原則 R1）。
     支払額は billOf。配車した担当へ返す額（carBack）は台数だけで決まるので成績とは無関係 */
  const mem=feeMembers().length||1;
  return DB.players.map(p=>{
    const play=expenseOf(p), cancel=cancelOf(p);
    const billRaw=play+cancel, bill=billOf(p), roundUp=bill-billRaw;   /* 切り上げたぶん。繰越金へ */
    const carBack=carBackOf(p);
    return payState({p,n:p.n,play,cancel,bill,billRaw,roundUp,carBack,cars:carsOf(p),net:carBack,mem});
  });
}
/* ---- 受け取った額と差額（2026-09-18、v55） ----
   以前は「受け取ったか」だけを持っていた。受け取ったあとで徴収額が変わっても
   （当日の欠席で頭割りの人数が減る・相乗りの変更・予想の直し）「受け取り済」のままで、
   追加でいただく額もお返しする額も出なかった（落とし穴39と同じ型。「済み」を最後に使う値で判定していない）。
   受け取った時点の額と内訳を残し、いまの徴収額との差を「差額」として出す。
     y … 受け取った額（お返ししたぶんは引く）
     w … 繰越金で埋めた額。足りないぶんだけ埋める。お返しするぶんは本人のお金なので埋めない
     play・fee・kq・gq・cancel・mem … 最後に精算したときの内訳（差額の理由を出すため）
   旧版の「受け取り済（true）」は、開いた時点の徴収額を受け取ったものとみなす */
const paySnap=x=>({play:x.play,cancel:x.cancel,mem:x.mem});
function payState(x){
  let r=DB.paid[x.n];
  if(r===true) r=DB.paid[x.n]=Object.assign({y:x.bill,w:0},paySnap(x));
  const got=!!(r&&typeof r==="object");
  const y=got?(+r.y||0):0;
  /* 埋めた額は、いま足りないぶんまで。あとで徴収額が下がったら、埋めたぶんから先に消える */
  const w=got?Math.min(Math.max(0,+r.w||0),Math.max(0,x.bill-y)):0;
  const diff=got?x.bill-y-w:0;
  return Object.assign(x,{got,paidY:y,cover:w,diff,snap:got?r:null,pend:got?diff!==0:x.bill>0});
}
/* 差額の理由。受け取ったときの内訳といまの内訳を比べる */
function payWhy(x){
  const s=x.snap; if(!s||!x.diff) return "";
  const r=[], d=(a,b)=>(b>a?"+":"−")+yen(Math.abs(b-a))+"円";
  const pw=+s.play||0;
  if(pw&&!x.play) r.push("プレーしないため、経費がなくなりました");
  /* V1：プレーしなくなっても懇親会費などは残る。残る額を添える */
  else if(pw>x.play&&x.p&&x.p.fee===false) r.push("プレーしないため、プレーの経費がなくなりました（残る経費 "+yen(x.play)+"円）");
  else if(pw!==x.play) r.push(!pw?"経費 "+yen(x.play)+"円が加わりました"
      :"経費 "+d(pw,x.play)+((+s.mem||0)!==x.mem?"（頭割りの人数 "+(+s.mem||0)+"→"+x.mem+"名）":""));
  if((+s.cancel||0)!==x.cancel) r.push(x.cancel?"キャンセル料 "+yen(x.cancel)+"円":"キャンセル料がなくなりました");
  return r.join("・")||"経費の額や切り上げの設定が変わりました";
}
const payDiffLab=x=>x.diff>0?"追加で "+yen(x.diff)+"円":"お返し "+yen(-x.diff)+"円";

/* ================= 計算 ================= */
/* ---- 無効口 ----
   成立しない買い目は売上に入れず、掛金をそのまま返す。
   入力の時点で弾いているので普通は出ない。旧版データの移行・ファイルの読み込み・
   スマホからの受け渡し、および投票の後で出走を取り消した場合に生じうる。 */
function kVoid(r){
  /* 2026-09-20：馬連（氏名2名、順不同）は枠ではなく出走者そのものを見る。GTOの gVoid と同じ考え方 */
  if(DB.meta.kMode==="馬連"){
    if(!RUN().length)return "";
    const a=nz(r.a),b=nz(r.b);
    if(!a||!b)return "指名が2名そろっていません";
    if(a===b)return "同じ人を2回指名しています";
    const out=[r.a,r.b].filter(n=>!RUN().some(x=>nz(x.n)===nz(n)));
    if(out.length)return "出走しない方を指名しています（"+out.join("、")+"）";
    return "";
  }
  const F=FRAMES();
  if(!F.length)return "";
  if(!F.includes(+r.a)||!F.includes(+r.b))return "無くなった枠を指名しています";
  return "";
}
function gVoid(r){
  if(!RUN().length)return "";
  const p=(r.p||[]).map(nz);
  if(p.length<3||p.some(x=>!x))return "指名が3名そろっていません";
  if(new Set(p).size<3)return "同じ人を2回以上指名しています";
  const out=(r.p||[]).filter((n,i)=>!RUN().some(x=>nz(x.n)===p[i]));
  if(out.length)return "出走しない方を指名しています（"+out.join("、")+"）";
  return "";
}
function calcK(){
  const bad=DB.keiba.filter(r=>kVoid(r)),live=DB.keiba.filter(r=>!kVoid(r));
  /* V1（M1）：口数と的中だけを数える。売上・配当・返金は無い（ptへの作り替えは M2） */
  const units=live.reduce((s,r)=>s+(+r.q||0),0);
  /* 2026-09-20：馬連は枠ではなく、上位2名の氏名の組合せ（順不同）で的中を判定する */
  const hits=DB.meta.kMode==="馬連"
    ?live.filter(r=>DB.result.top2.filter(Boolean).length===2&&ckN(r.a,r.b)===ckN(DB.result.top2[0],DB.result.top2[1]))
    :live.filter(r=>ck(r.a,r.b)===DB.result.frame);
  const win=hits.reduce((s,r)=>s+(+r.q||0),0);
  const by={};hits.forEach(r=>by[r.v]=(by[r.v]||0)+(+r.q||0));
  const bb={};bad.forEach(r=>bb[r.v]=(bb[r.v]||0)+(+r.q||0));
  const bu=bad.reduce((s,r)=>s+(+r.q||0),0);
  return {units,win,nohit:win===0,
    bad:bad.map(r=>({...r,why:kVoid(r)})),badUnits:bu,badBy:bb,
    allUnits:units+bu,
    winners:Object.entries(by).map(([n,c])=>({n,c})).sort((a,b)=>b.c-a.c)};
}
function gtoHit(r){
  const L=DB.result.low.map(nz);
  if(L.some(x=>!x))return false;
  const p=r.p.map(nz);
  if(new Set(p).size<3)return false;
  return DB.meta.gMode==="3連単"?p.join("|")===L.join("|"):p.every(x=>L.includes(x));
}
function calcG(){
  const bad=DB.gto.filter(r=>gVoid(r)),live=DB.gto.filter(r=>!gVoid(r));
  /* V1（M1）：口数と的中だけ。的中なしでも返金は無い（お金を集めていないため） */
  const units=live.reduce((s,r)=>s+(+r.q||0),0);
  const hits=live.filter(gtoHit);
  const win=hits.reduce((s,r)=>s+(+r.q||0),0);
  const by={};hits.forEach(r=>by[r.v]=(by[r.v]||0)+(+r.q||0));
  const bb={};bad.forEach(r=>bb[r.v]=(bb[r.v]||0)+(+r.q||0));
  const bu=bad.reduce((s,r)=>s+(+r.q||0),0);
  return {units,win,nohit:win===0,
    bad:bad.map(r=>({...r,why:gVoid(r)})),badUnits:bu,badBy:bb,
    allUnits:units+bu,
    winners:Object.entries(by).map(([n,c])=>({n,c})).sort((a,b)=>b.c-a.c)};
}
function votes(){
  const m={};RUN().forEach(p=>m[p.n]=0);
  DB.gto.filter(r=>!gVoid(r)).forEach(r=>r.p.forEach(n=>{
    const k=RUN().find(p=>nz(p.n)===nz(n));if(k)m[k.n]+=(+r.q||0);}));
  return Object.entries(m).map(([n,c])=>({n,c})).sort((a,b)=>b.c-a.c);
}
function calcB(){
  const top=+DB.meta.fineTop||3, v=votes(), auto=v.slice(0,top).map(x=>x.n);
  const sel=[];for(let i=0;i<top;i++)sel.push(DB.result.sel[i]||auto[i]||"");
  const th=v[top-1]?v[top-1].c:null;
  const tie=th!==null&&v.filter(x=>x.c===th).length>1;
  const dup=new Set(sel.filter(Boolean)).size<sel.filter(Boolean).length;
  /* V1（M1）：選抜者に何人負けたか（lost）だけを数える。金額は無い（ptへの作り替えは M3） */
  const g=DB.result.gross;
  const selG=sel.map(n=>g[n]).filter(x=>x!==undefined&&x!=="").map(Number);
  const list=[];
  RUN().forEach(p=>{
    const my=g[p.n];
    if(my===undefined||my==="")return;
    if(sel.some(n=>nz(n)===nz(p.n)))return;
    const lost=selG.filter(x=>+my>x).length;
    if(lost>0)list.push({n:p.n,f:p.f,g:+my,lost});
  });
  list.sort((a,b)=>b.lost-a.lost||b.g-a.g);
  return {sel,auto,tie,dup,votes:v,sg:sel.map(n=>g[n]),list,lostSum:list.reduce((a,b)=>a+b.lost,0)};
}
function ledger(){
  /* V1（M1）：予想の口数・的中口数・無効口数・選抜者に負けた数だけ。お金は無い */
  const K=calcK(),G=calcG(),B=calcB(),kq={},gq={};
  DB.keiba.forEach(r=>kq[r.v]=(kq[r.v]||0)+(+r.q||0));
  DB.gto.forEach(r=>gq[r.v]=(gq[r.v]||0)+(+r.q||0));
  const names=[...new Set([...VOT().map(p=>p.n),...Object.keys(kq),...Object.keys(gq)])];
  return names.map(n=>({n,ku:kq[n]||0,gu:gq[n]||0,
    kw:(K.winners.find(w=>w.n===n)||{c:0}).c, gw:(G.winners.find(w=>w.n===n)||{c:0}).c,
    bad:(K.badBy[n]||0)+(G.badBy[n]||0),
    lost:(B.list.find(x=>x.n===n)||{lost:0}).lost}));
}

/* ================= 画面 ================= */
/* ---- 準備 → 当日 → 発表 の3段階 ----
   11本のタブを、使う時期で3つに束ねる（2026-09-16、デザイン案の取り込み）。
   ・いまの段階より前の段階は1行に畳む。消さない。押せば開く
   ・いまの段階と、この先の段階はそのまま並べる
   ・データと使い方はどの段階でも出す
   以前の「当日モード」（準備中／当日の2状態）は、この3段階に含まれる。
   当日は準備のタブを触らない（触ると壊しかねない）ので畳むのは変わらない。
   dayMode は古いファイルとの互換のために残し、phase と同時に書き換える */
const PHASES=[["prep","準備"],["day","当日"],["award","発表"]];
const PHLAB={prep:"準備中",day:"当日",award:"発表"};
/* 賞金・収支は金額を決める画面なので準備へ。当日に使う集金は「集金」として独立させた。
   大会ハブはどの段階でも使う入口なので、段階の外（top）に置く */
const PHASE_OF={hub:"top",meta:"prep",rules:"prep",players:"prep",groups:"prep",bets:"prep",money:"prep",
  collect:"day",score:"day",prize:"day",rank:"award",sum:"award",result:"award",share:"award",
  data:"etc",help:"etc"};
const PHASE=()=>{const p=DB.meta.phase;
  return PHASES.some(([k])=>k===p)?p:(DB.meta.dayMode?"day":"prep");};
const DAYMODE=()=>PHASE()!=="prep";
const phIdx=k=>PHASES.findIndex(([x])=>x===k);
const phOf=k=>PHASE_OF[k]||"etc";
/* 段階の中の並び。当日は「集金 → スコア → 技能賞」の順に使う */
const TAB_ORDER=["hub","meta","rules","players","groups","bets","money","collect","score","prize","rank","sum","result","share","data","help"];
const byOrder=(a,b)=>TAB_ORDER.indexOf(a[0])-TAB_ORDER.indexOf(b[0]);
/* 畳んだ段階をその場で開いたもの。ファイルには残さない */
let PHOPEN={};
/* 使う機能を足して新しく出たタブ。開くまで NEW を付ける。ファイルには残さない */
let NEWTABS={};
const phFolded=k=>k!=="etc"&&k!=="top"&&phIdx(k)<phIdx(PHASE())&&!PHOPEN[k];
/* 画面の一覧。段階2（2026-09-17）で「大会ハブ」「集金」「順位・表彰」「結果共有・出力」を足した。
   段階3で「追加ルール」を大会設定から独立させた（デザイン案P4のサイドバー）。
   既存の11画面のキーは変えない（保存ファイル・テスト・他の画面からの go() が使っている）。
   ホーム（home）と作成画面（make）は一覧に入れない。サイドバーもタブも出さない入口の画面なので */
function tabAll(){

  if(U("score")) t.push(["score","スコア入力"],["rank","順位・表彰"]);

  /* V1（M1）：「賞金・収支」を「賞品・経費」に改めた（SPEC-V1.md 5章）。賞は品物、お金は経費だけ */
  if(U("prize")||U("budget")) t.push(["money","賞品・経費"]);

  t.push(["result","結果・発表"],["share","結果共有・出力"],["data","データ"],["help","使い方"]);
  return t;

function tabsHtml(){

  }).join("");

  const sx=window.scrollX||window.pageXOffset||0, sy=window.scrollY||window.pageYOffset||0;

/* 開催日。年・月・日の区切りが「.」「/」「-」「年月日」のどれでも読む。読めなければ null。

const DOW="日月火水木金土";
function evDate(s){
  const m=/^\s*(\d{4})\s*[.\/\-年]\s*(\d{1,2})\s*[.\/\-月]\s*(\d{1,2})/.exec(String(s||""));
  if(!m) return null;
  const d=new Date(+m[1],+m[2]-1,+m[3]);
  return d.getMonth()===+m[2]-1?d:null;
}

function daysLeft(s,now){
  const d=evDate(s); if(!d) return null;
  const t=now?new Date(now):new Date(); t.setHours(0,0,0,0);
  return Math.round((d-t)/864e5);
}

  const named=DB.players.filter(p=>nz(p.n));
  const plays=named.filter(needsGroup);
  if(k==="players") return named.length?named.length+"":"";
  if(k==="rules") return ruleOnN()+"";
  if(k==="groups"){ if(!plays.length) return "";
    const need=Math.ceil(plays.length/(+DB.meta.groupSize||4));
    const have=new Set(plays.map(p=>+p.g).filter(g=>g>0)).size;
    return have+"/"+need; }
  /* 集金は差額が無くなって済み。スコアはネットが出て済み（ノーカードの印も済み）。
     どちらも画面の中の判定とそろえる（v55。一覧の数だけ「16/16」と出て、中では「残り1名」だった） */
  if(k==="collect"){ const T=named.length?settleC().filter(x=>x.bill>0||x.got):[];
    return T.length?T.filter(x=>!x.pend).length+"/"+T.length:""; }
  if(k==="score"){ const S=scoreState();
    return S.all?S.done+"/"+S.all:""; }
  if(k==="prize"){ const R=skillRows(); const n=R.reduce((a,x)=>a+x.n,0);
    return n?R.reduce((a,x)=>a+x.wonN,0)+"/"+n:""; }
  if(k==="bets"){ const V=named.filter(p=>p.vote); if(!V.length) return "";
    const who=new Set([...DB.keiba,...DB.gto].map(b=>nz(b.v)));
    return V.filter(p=>who.has(nz(p.n))).length+"/"+V.length; }
  return "";
}

  /* ok：true＝済み（✓）、false＝要対応（●）、null＝説明だけ */
  const stat=(k,l,v,sub,ok,to)=>({k,h:`<button class="hb-s" onclick="go('${to}')"><small>${l}</small><b>${v}</b>
    <span class="${ok===true?"ok":ok===false?"ng":""}">${ok===true?"✓ ":ok===false?"● ":""}${sub}</span></button>`});
  const bd=named.filter(p=>nz(p.bd)).length, needBd=["older","younger"].includes(SC().tiebreak);

  const units=L=>L.reduce((a,r)=>a+(+r.q||0),0);

  const C={
    players:()=>stat("players","参加者",named.length+"<em>名</em>",
      named.length?"生年月日 "+bd+"/"+named.length:"まだいません",
      named.length?(bd===named.length||!needBd?true:false):false,"players"),
    groups:()=>stat("groups","組合せ",gc.replace("/","<em> / </em>")+"<em>組</em>",
      !plays.length?"参加者を入れると組めます":noG?"組の決まっていない方 "+noG+"名":noTime?"スタート時刻 未設定 "+noTime+"組":"スタート時刻 設定済",
      !plays.length?null:!(noG||noTime),"groups"),
    method:()=>stat("method","競技方法",`<span class="tx">${esc(SYSL[SC().system]||"")}</span>`,
      esc(methodSum().replace(new RegExp("^"+(SYSL[SC().system]||"")+"・?"),"")),null,"meta"),
    keiba:()=>stat("keiba","馬券（枠連）",units(DB.keiba)+"<em>口</em>",

      !named.length?null:!frameStep||frameStep.done,"players"),
    gto:()=>stat("gto","GTO（下位予想）",units(DB.gto)+"<em>口・"+esc(m.gMode)+"</em>",
      units(DB.gto)?"予想 "+units(DB.gto)+"口 入力済":"予想はまだありません",units(DB.gto)?true:null,"bets"),
    fine:()=>stat("fine","罰金",m.fineTop+"<em>名と勝負</em>",
      U("gto")?"得票上位"+m.fineTop+"名とグロスで勝負します":"GTOと一緒に使います",U("gto")?null:false,"meta"),
    collect:()=>{const c=cnt("collect");return stat("collect","集金",(c[0]||"0")+"<em> / "+(c[1]||"0")+"名</em>",
      c[1]?(c[0]===c[1]?"全員から受け取りました":"残り "+(c[1]-c[0])+"名"):"集める方がいません",c[1]?c[0]===c[1]:null,"collect");},
    score:()=>{const c=cnt("score");return stat("score","スコア",(c[0]||"0")+"<em> / "+(c[1]||"0")+"名</em>",

    prize:()=>{const c=cnt("prize");return stat("prize","ニアピン・ドラコン",(c[0]||"0")+"<em> / "+(c[1]||"0")+"ホール</em>",
      c[1]?(c[0]===c[1]?"全ホール決まりました":"残り "+(c[1]-c[0])+"ホール"):"対象ホールがありません",c[1]?c[0]===c[1]:null,"prize");}

const COPYKEYS=["place","groupSize","use","gMode","kMode","frameMode","fineTop",
  "nearHoles","nearAnyHoles","drakoHoles","sc","prizes","team","lucky"];
function copyRules(d){
  const s=d.meta, m=DB.meta, cp=v=>JSON.parse(JSON.stringify(v));

  if(renamed) m.name=s.name.replace(r[0],"第"+(+r[1]+1)+"回");

/* 発表の並びの要約。buildSlides() の識別子から、ひと続きの区切りにまとめる。
   発表中の状態（slides・S）は書き換えないよう、作ったあとに戻す */
let RKSORT="n";
const SLIDECAT=[[/^cover$/,"開幕"],[/^nearAny/,"何でもニアピン"],[/^near/,"ニアピン"],[/^drako/,"ドラコン"],
  [/^s-(in|best|\d+)$/,"競技結果"],[/^t-/,"団体賞"],[/^s-(pz\d+|other)$/,"賞"],[/^k-/,"馬券"],[/^g(-|\d)/,"GTO"],
  [/^b-/,"選抜者・罰金"],[/^lucky$/,"ラッキー賞"],[/^end$/,"締め"]];
function showPlan(){
  const keepSl=slides, keepS=S; let ids=[];
  try{ buildSlides(); ids=slides.map(x=>x.id); }catch(e){ ids=[]; }
  finally{ slides=keepSl; S=keepS; }
  const parts=[];
  ids.forEach(id=>{ const c=(SLIDECAT.find(([re])=>re.test(id))||[,"その他"])[1];
    const l=parts[parts.length-1]; if(l&&l.l===c) l.n++; else parts.push({l:c,n:1}); });
  return {n:ids.length,parts};
}
function vRank(){

  };

  const tieRow=(r,i)=>st.net[i+1]&&st.net[i+1].net===r.net
    ?`<tr class="tie"><td colspan="6">${r.rank}位と${r.rank+1}位は同ネット（${r.net}）。${tieWhy(r.p,st.net[i+1].p)}</td></tr>`:"";
  const R=`<div class="card r-main"><h2>${esc(DB.meta.name)}　競技結果 <small>${esc(DB.meta.date)} ${esc(DB.meta.place)}</small></h2>
    ${(()=>{if(mode==="sheet")return"";

      return cap.length?`<div class="msg warn">ハンディが上限（${SC().hcMax}）に達した方が ${cap.length}名 います。
        ${cap.map(r=>esc(r.n)+"（本来 "+hcRaw(r.p)+" → "+r.hc+"）").join("　")}<br>
        上限の有無で順位が変わる可能性があります。大会設定で切り替えられます。</div>`:"";})()}
    <table class="r-tab"><thead><tr><th class="c" style="width:56px">順位</th><th style="min-width:10.5em">氏名</th>
      <th class="n" style="width:70px">グロス</th><th class="n" style="width:66px">HDCP</th>
      <th class="n" style="width:78px">ネット</th><th style="min-width:9em">賞</th></tr></thead><tbody>
    ${st.net.map((r,i)=>`<tr class="zebra${r.rank<=3?" r-top r-"+r.rank:""}"><td class="c r-rk">${r.rank}</td>
      <td class="r-nm"><b>${esc(r.n)}</b>${nz(r.p.org)?`<small>${esc(r.p.org)}</small>`:""}</td>
      <td class="n">${r.g}</td><td class="n">${r.hc}</td><td class="n r-net"><b>${r.net}</b></td>
      <td class="r-pzs">${pz(r.n)}</td></tr>${tieRow(r,i)}`).join("")||
      '<tr><td colspan="6">スコアを入れると、ネットの順位がここに並びます。</td></tr>'}
    </tbody></table>
    ${st.net.length?bestWhy(st):""}

  /* 反映済みならその場で始める。順位が変わっていたら知らせて反映へ（9/17の決定） */
  const stale=st.net.length?resultStale():[];

  const m3=(()=>{

    const byG=RKSORT==="g", L=byG?st.gross:st.net;
    const tieNote=(r,i)=>{const o=byG?(L[i-1]&&L[i-1].g===r.g?L[i-1]:L[i+1]&&L[i+1].g===r.g?L[i+1]:null)
      :(L[i-1]&&L[i-1].net===r.net?L[i-1]:L[i+1]&&L[i+1].net===r.net?L[i+1]:null);
      return o?(byG?"同グロス":"同ネット")+"・"+({older:"年長者が上",younger:"年少者が上",lowhc:"ハンディの小さい方が上",none:"入力順"}[SC().tiebreak]||""):"";};
    const pzl=n=>{const x=[]; if(U("prize")) prizeRows().filter(r=>r.who&&nz(r.who)===nz(n)).forEach(r=>x.push(r.label));
      if(st.best&&st.best.n===n&&!x.some(l=>/ベスグロ/.test(l))) x.push("ベスグロ"); return x.join("・");};
    return `<div class="m3 no-print">
      <div class="m3-top"><small>${stale.length?"反映前":"順位確定"}・${esc(SYSL[SC().system]||"")}</small>
        <div class="m3-sort" role="group" aria-label="並べ方"><button class="${byG?"":"on"}" onclick="RKSORT='n';render()">ネット</button><button class="${byG?"on":""}" onclick="RKSORT='g';render()">グロス</button></div></div>
      ${stale.length?`<div class="msg warn">いまの順位が、発表に使う結果（${stale.join("・")}）と合っていません。</div>`:""}
      <ol class="m3-list">${L.map((r,i)=>{const rk=byG?r.grank:r.rank, t=tieNote(r,i), z=pzl(r.n);
        return `<li class="m3-c${rk===1?" first":""}"><span class="m3-rk">${rk}</span>
          <span class="m3-nm"><strong>${esc(r.n)}</strong><small>${r.g} − ${r.hc??"—"}${z?" ・ "+esc(z):""}${t?" ・ "+esc(t):""}</small></span>
          <span class="m3-v">${byG?r.g:r.net}</span></li>`;}).join("")}</ol>
      <div class="m3-act">${stale.length?`<button class="btn primary" onclick="applyScores()">結果を反映して発表の準備へ</button>`
        :`<button class="btn primary" onclick="startShow()">▶ 発表をはじめる</button><small>プロジェクターにつないだPCで開くのがおすすめです</small>`}
        <button class="btn" onclick="go('share')">結果を共有する</button></div>
    </div>`;})();
  pane.innerHTML=`${m3}
  <div class="r-bar no-print">
    <span class="r-cnt">${st.net.length===all&&all?"全員入力済":"入力済み "+st.net.length+" / "+all+"名"}${st.net.length?" ・ いまの1位 "+esc(st.net[0].n):""}</span>
    <button class="btn ghost" onclick="window.print()">競技結果を印刷</button>
    <button class="btn ghost" onclick="go('result')">結果・発表の画面へ</button>
    ${!st.net.length?"":stale.length?`<button class="btn primary" onclick="applyScores()">結果を反映して発表の準備へ</button>`
      :`<button class="btn ghost" onclick="startShow();panelOpen()">操作パネルつきで始める</button>
        <button class="btn primary" onclick="startShow()">▶ 発表をはじめる</button>`}</div>
  ${stale.length?`<div class="msg warn no-print r-stale" style="margin-bottom:16px">いまの順位が、発表に使う結果（${stale.join("・")}）と合っていません。
    スコアを直したあとは「結果を反映」を押してから発表してください。</div>`:""}
  <div class="r-grid">${R}${side}</div>`;
}

/* ---- 大会設定の「詳しく」（2026-09-16、デザイン案P2の取り込み） ----
   大会設定だけで約1万文字あり、年に数回しか使わない幹事には多すぎた。
   基本の4項目と追加ルールだけを開いて見せ、コース・競技方法などは既定のまま畳む。
   ・中身は消さずに <details> で畳む（開けば今までどおり）
   ・畳んだ見出しに今の設定を1行で出す。開かなくても中身が分かる
   ・直す必要があるもの（パーと合わないホール、原資を超える賞金）は開いた状態で出す
   開閉はファイルに残さない。画面を作り直しても保つよう、ここで覚えておく */
let FOLD={};
const FOLDKEYS=()=>[U("score")&&"course",U("score")&&"method",
  (U("near")||U("nearAny")||U("drako"))&&"holes",(U("keiba")||U("gto")||U("fine"))&&"games",
  U("budget")&&"budget"].filter(Boolean);
const FOLDWARN={holes:()=>holeWarn().length>0,budget:()=>!!prizeCapIssue()};
const foldOpen=k=>FOLD[k]!==undefined?FOLD[k]:!!(FOLDWARN[k]&&FOLDWARN[k]());
/* toggle は、描画した時点で open のものにも後から届く。
   描画したときの状態と同じなら記録しない（空の大会で警告が出て開いた状態が、
   サンプルを入れたあとも残ってしまった） */
function foldSet(k,o,el){
  const last=el?(el._last!==undefined?el._last:el.dataset.d==="1"):null;
  if(el&&last===!!o) return;
  if(el) el._last=!!o;
  FOLD[k]=!!o;
}
function foldAll(o){ FOLDKEYS().forEach(k=>FOLD[k]=!!o); render(); }
const fold=(k,title,sum,body,warn)=>`<details class="card fold" id="sec-${k}" ${foldOpen(k)?"open":""}
  data-d="${foldOpen(k)?1:0}" ontoggle="foldSet('${k}',this.open,this)"><summary><span class="fold-t">${title}</span>
  <span class="fold-s">${sum}</span>${warn?'<span class="fold-w">要確認</span>':""}</summary>
  <div class="fold-b">${body}</div></details>`;
const SYSL={double:"ダブルペリア",new:"新ペリア",none:"ハンディなし"};
const CUTL={triplePar:"上限パー×3",doublePar:"上限パー×2",tripleBogey:"上限パー＋3",none:"1ホールの上限なし"};
const TIEL={older:"同スコアは年長者",younger:"同スコアは年少者",lowhc:"同スコアはハンディの小さい方",none:"同スコアは決めない"};
function methodSum(){
  const c=SC();
  if(ENT()==="sheet") return "ゴルフ場の集計表から入力・"+TIEL[c.tiebreak];
  return [SYSL[c.system],c.system!=="none"?CUTL[c.cut]:"",
    c.system!=="none"?(c.hcUse!==false?"ハンディ上限"+c.hcMax:"ハンディ上限なし"):"",TIEL[c.tiebreak]]
    .filter(Boolean).join("・");
}
function holesSum(){

  if(U("near")) out.push("ニアピン "+(m.nearHoles.join("・")||"なし"));
  if(U("nearAny")) out.push("何でもニアピン "+((m.nearAnyHoles||[]).join("・")||"なし"));

/* ---- 追加ルール（2026-09-16 大会設定のカード。2026-09-17 段階3で独立した画面にした） ----

   チェックボックスはそのまま使い、見た目だけ切替にする。
   クラス名 .rule は表彰式の飾り罫で使っているので、ここは .rcard にする */
const RULEG=[["競技",[["score","スコア・順位","ペリア方式でネット順位を出す"],
                    ["near","ニアピン","パー3でピンに最も近づけた人"],
                    ["nearAny","何でもニアピン","何打目でもよいニアピン"],
                    ["drako","ドラコン","パー5で最も遠くへ飛ばした人"],
                    ["birdie","イーグル・バーディー賞","対象ホールを決めずに自動判定。手入力は不要"]]],
            ["予想ゲーム",[["keiba","馬券（枠連予想）","ネット上位2名の枠の組合せを当てる"],
                    ["gto","GTO（下位予想）","グロス下位3名を当てる"],
                    ["fine","罰金","得票上位者とグロスで勝負する（お金は動かない）"]]],
            ["賞と経費",[["prize","賞品","順位賞・技能賞の賞品（品名と出どころ）を管理"],
                    ["budget","経費・集金","経費の項目と集金・収支をまとめる"],
                    ["team","団体賞","所属ごとのネット合計で競う"],
                    ["lucky","ラッキー賞","受賞のない方から抽選"]]]];
const RULEKEYS=()=>RULEG.flatMap(([,ks])=>ks.map(([k])=>k));
const ruleOnN=()=>RULEKEYS().filter(k=>U(k)).length;
/* 選ぶ前に、何が増えるかを見せる（2026-09-16） */
const ruleFn=k=>({score:"画面が増える：スコア入力・順位・表彰",near:"画面が増える：ニアピン・ドラコン",
    nearAny:"画面が増える：ニアピン・ドラコン",drako:"画面が増える：ニアピン・ドラコン",
    birdie:"順位・表彰に一覧が増える（18ホールの内訳が無いと出ません）",
    keiba:"画面が増える：予想入力・集計",gto:"画面が増える：予想入力・集計",
    fine:U("gto")?"発表に選抜者と罰金の画面":"GTOの得票で決まるので、GTOと一緒に使います",
    prize:"画面が増える：賞品・経費",budget:"画面が増える：賞品・経費",
    team:"発表に団体賞の画面が1枚増える",lucky:"発表の最後に抽選の画面が1枚増える"})[k];
/* 技能賞のカードには対象ホールも出す。パーと合わなければその場で知らせる */

function rulesHtml(){

/* ---- 生年月日の解釈 ---- */
const pad2=n=>("0"+n).slice(-2);
const ymd=(y,m,d)=>(y>1900&&y<2100&&m>=1&&m<=12&&d>=1&&d<=31)?y+"-"+pad2(m)+"-"+pad2(d):"";
function parseDate(t){
  t=String(t||"").trim();
  if(!t) return "";
  let m=t.match(/([SHRTMshrtm]|昭和|平成|令和|大正|明治)\s*[.\-\/]?\s*(\d{1,2})\s*[.\-\/年]\s*(\d{1,2})\s*[.\-\/月]\s*(\d{1,2})/);
  if(m){
    const k={M:1867,T:1911,S:1925,H:1988,R:2018,"明治":1867,"大正":1911,"昭和":1925,"平成":1988,"令和":2018};
    const b=k[m[1].toUpperCase()]??k[m[1]];
    if(b) return ymd(b+ +m[2],+m[3],+m[4]);
  }
  m=t.match(/(\d{4})\s*[.\-\/年]\s*(\d{1,2})\s*[.\-\/月]\s*(\d{1,2})/);
  if(m) return ymd(+m[1],+m[2],+m[3]);
  m=t.match(/(?:^|[^\d])(\d{5})(?:[^\d]|$)/);
  if(m){const n=+m[1];
    if(n>=3000&&n<=60000){const d=new Date(Date.UTC(1899,11,30)+n*86400000);
      return ymd(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate());}}
  return "";
}
const DATERE=/([SHRTMshrtm]|昭和|平成|令和|大正|明治)\s*[.\-\/]?\s*\d{1,2}\s*[.\-\/年]\s*\d{1,2}\s*[.\-\/月]\s*\d{1,2}\s*日?|\d{4}\s*[.\-\/年]\s*\d{1,2}\s*[.\-\/月]\s*\d{1,2}\s*日?|(?:^|[^\d])\d{5}(?=[^\d]|$)/;
const isDateToken=t=>{
  const d=parseDate(t); if(!d) return false;
  const m=String(t).match(DATERE);
  return m?String(t).replace(m[0],"").replace(/[\s\u3000日]/g,"")==="":false;
};
function parsePlayers(text){
  return tidy(text).split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(line=>{
    const sep=line.includes("\t")?/\t/:((/[,、]/.test(line))?/[,、]/:/ {2,}|\u3000{2,}/);
    let tk=line.split(sep).map(x=>x.trim()).filter(Boolean);
    let bd="",rest=[];
    tk.forEach(t=>{ if(!bd&&isDateToken(t)) bd=parseDate(t); else rest.push(t); });
    if(!bd){
      for(let i=0;i<rest.length;i++){
        const m=rest[i].match(DATERE);
        if(m){const d=parseDate(m[0]); if(d){bd=d;rest[i]=rest[i].replace(m[0],"").trim();break;}}
      }
      rest=rest.filter(Boolean);
    }
    const name=rest[0]||"",org=rest.slice(1).join(" ");
    const hit=DB.players.find(p=>nz(p.n)===nz(name));
    return {line,name,org,bd,exists:!!hit,ok:!!name};
  });
}

function pEdit(i,k,v){

/* ---- スタート時刻の一括入力（段階4） ---- */
function tParse(s){
  const m=/^\s*(\d{1,2})\s*[:時.]\s*(\d{1,2})\s*分?\s*$/.exec(String(s||"").normalize("NFKC"));
  if(!m) return null;
  const h=+m[1], mi=+m[2];
  return (h<24&&mi<60)?h*60+mi:null;
}
const tFmt=v=>Math.floor(v/60)%24+":"+String(v%60).padStart(2,"0");
function gStartSet(k,v){

  if(DB.groups.some(g=>nz(g.time))&&!confirm("入っている時刻を上書きします。よろしいですか。")) return;
  DB.groups.slice().sort((a,b)=>a.no-b.no).forEach((g,i)=>g.time=tFmt(t0+i*gap));
  touch(); render();
}

  if(!wait.length){ alert("組の決まっていない方はいません。"); return; }
  wait.forEach(p=>{
    let g=DB.groups.slice().sort((a,b)=>a.no-b.no).find(x=>inGroup(x.no).length<size);
    if(!g){ g={no:Math.max(0,...DB.groups.map(x=>x.no))+1,time:""}; DB.groups.push(g); }
    gSetG(p,g.no);
  });
  GPICK=-1; touch(); render();
}
function gAuto(){
  const n=+DB.meta.groupSize||4;
  const need=Math.ceil(DB.players.length/n);
  while(DB.groups.length<need) DB.groups.push({no:Math.max(0,...DB.groups.map(g=>g.no))+1,time:""});
  DB.players.forEach((p,i)=>{const g=DB.groups[Math.floor(i/n)];
    if(g){p.g=g.no;if(DB.meta.frameMode==="group")p.f=g.no;}});
  GPICK=-1; touch();render();
}

/* ---- 枠を2人ずつ自動で割り振る ----
   組と枠は別のもの。組は同じ時間に一緒に回る4名、枠は馬券の賭け単位で2名。
   16名なら 4組 × 4名 と 8枠 × 2名 になる。

   枠づくりで大事なのは2つ。
     ・組をまたぐこと。同じ組の2人で枠を作ると、一緒に回った者同士になり
       ネット上位2名が同じ枠に入りやすくなって馬券が荒れる
     ・実力が拮抗すること。強い2人の枠ができると、そこに票が集まって
       ゲームにならない。上手い人と苦手な人を組ませて、どの枠も似た強さにする

   実力の目安（p.skill）が2名以上に入っていれば、それを使って
   「一番上手い人」と「一番苦手な人」から順に突き合わせる。
   入っていなければ、組をまたぐことだけを守って割り振る。
   「出走なし」（f が 0）の人は触らず0のまま。奇数なら最後の枠だけ1人。 */
function fPair2(){
  /* 対象は「出走する人」。枠がまだ0でも、組が決まっていれば出走とみなす。
     枠だけで判定すると、初めて割り振るとき誰も対象にならない */
  const run=DB.players.filter(p=>+p.f>0||+p.g>0);
  if(!run.length){alert("出走する方がいません。先に組を割り当ててください。");return;}
  const withSkill=run.filter(p=>skillOf(p)!==null);
  let order;
  if(withSkill.length>=2){
    /* 実力順に並べ、両端から突き合わせる。1位と最下位、2位と下から2番目… */
    const s=run.slice().sort((a,b)=>{
      const x=skillOf(a),y=skillOf(b);
      if(x===null&&y===null) return 0;
      if(x===null) return 1;          /* 目安の無い人は後ろへ */
      if(y===null) return -1;
      return x-y;                      /* スコアなので小さいほど上手い */
    });
    order=[];
    let i=0,j=s.length-1;
    while(i<j){ order.push(s[i++],s[j--]); }
    if(i===j) order.push(s[i]);
  }else{
    /* 目安が無いときは、組をまたぐことだけを守る。
       組ごとに列を作り、横に取っていくと必ず別の組の人と組める */
    const byG={};
    run.forEach(p=>{const g=+p.g||0;(byG[g]=byG[g]||[]).push(p);});
    const cols=Object.keys(byG).sort((a,b)=>+a-+b).map(k=>byG[k]);
    order=[];
    for(let r=0;cols.some(c=>c[r]);r++) cols.forEach(c=>{if(c[r])order.push(c[r]);});
  }
  let f=0;
  order.forEach((p,c)=>{ if(c%2===0)f++; p.f=f; });
  touch();render();
}
/* 枠づくりの出来を見る。同じ組どうしの枠がいくつあるか、
   枠ごとの実力の差がどれだけ開いているか */
function frameCheck(){
  const byF={};
  DB.players.forEach(p=>{if(+p.f>0)(byF[p.f]=byF[p.f]||[]).push(p);});
  const rows=Object.keys(byF).sort((a,b)=>+a-+b).map(f=>{
    const a=byF[f], sk=a.map(skillOf).filter(x=>x!==null);
    return {f:+f,names:a.map(x=>x.n),groups:[...new Set(a.map(x=>+x.g||0))],
      sameGroup:a.length>1&&new Set(a.map(x=>+x.g||0)).size===1,
      sum:sk.length?sk.reduce((x,y)=>x+y,0):null,n:a.length};
  });
  const sums=rows.map(r=>r.sum).filter(x=>x!==null);
  return {rows,sameGroup:rows.filter(r=>r.sameGroup).length,
    spread:sums.length>1?Math.max(...sums)-Math.min(...sums):null};
}
/* 枠づくりの出来を参加者タブに一言で出す */
function frameNote(){
  const F=frameCheck();
  if(!F.rows.length) return "";
  const cross=F.sameGroup
    ? "うち <b>"+F.sameGroup+"つが同じ組どうし</b>です。一緒に回った2人だと、"
      +"ネット上位2名が同じ枠に入りやすく馬券が荒れます。"
      +"「枠を2人ずつ割り振る」で組をまたぐように直せます。"
    : "すべて組をまたいでいます。";
  const bal=F.spread!==null
    ? "<br>実力の目安の合計は、いちばん強い枠といちばん弱い枠で <b>"+F.spread
      +"</b> の差です。差が小さいほど票が散り、ゲームになります。"
    : "<br>実力の目安を入れると、拮抗するように割り振れます（順位の計算には使いません）。";
  return '<div class="msg '+(F.sameGroup?"warn":"ok")+'" style="margin-top:12px">'
    +"<b>枠 "+F.rows.length+"つ</b>。"+cross+bal+"</div>";
}

   「投票」と「投票のみ」を別々のチェックにしていたが、
   前者は「予想ゲームに参加するか」、後者は「プレーするか」で軸が違い、

/* ---- 長押しで運ぶ（スマホ・タブレット、段階4） ----
   押したまま 450ms 動かさなければ「運ぶ」状態にする。それより前に指が動いたらスクロールとみなしてやめる。
   運んでいる間は touchmove の既定の動き（スクロール）を止め、指の下の組（data-g）を光らせる。
   離したらその組へ移す。組の外で離したら何もしない。
   iPhone の WebKit はこの環境で試せないので、押して選ぶ道（gPickI）を必ず残す（落とし穴22） */
let LP=null;
const LPMS=450;
function lpStart(e,i){
  if(!e.touches||e.touches.length!==1) return;
  lpCancel();
  const t=e.touches[0], el=e.currentTarget;
  LP={i,x:t.clientX,y:t.clientY,on:false,to:null,el};
  LP.tm=setTimeout(()=>{
    if(!LP) return;
    LP.on=true;
    if(LP.el&&LP.el.classList) LP.el.classList.add("lifting");
    document.body.classList.add("lp-on");
    const gh=document.createElement("div");
    gh.className="lp-ghost"; gh.id="lpGhost";
    gh.textContent=(DB.players[i]||{}).n||"";
    if(gh.style){ gh.style.left=LP.x+"px"; gh.style.top=LP.y+"px"; }
    if(document.body.appendChild) document.body.appendChild(gh);
    try{ if(typeof navigator!=="undefined"&&navigator.vibrate) navigator.vibrate(15); }catch(x){}
  },LPMS);
}
function lpMove(e){
  if(!LP||!e.touches||!e.touches[0]) return;
  const t=e.touches[0];
  if(!LP.on){ if(Math.hypot(t.clientX-LP.x,t.clientY-LP.y)>10) lpCancel(); return; }
  if(e.cancelable) e.preventDefault();
  const gh=document.getElementById("lpGhost");
  if(gh&&gh.style){ gh.style.left=t.clientX+"px"; gh.style.top=t.clientY+"px"; }
  const hit=document.elementFromPoint?document.elementFromPoint(t.clientX,t.clientY):null;
  const z=hit&&hit.closest?hit.closest("[data-g]"):null;
  document.querySelectorAll("[data-g].over").forEach(x=>{ if(x!==z) x.classList.remove("over"); });
  if(z&&z.classList) z.classList.add("over");
  LP.to=z?+z.dataset.g:null;
}
function lpEnd(e){
  if(!LP) return;
  const on=LP.on, to=LP.to, i=LP.i;
  lpCancel();
  if(!on) return;
  if(e&&e.cancelable) e.preventDefault();
  LPJUST=Date.now();
  if(to!==null&&to!==undefined&&!isNaN(to)) gMoveI(i,to);
}
function lpCancel(){
  if(!LP) return;
  clearTimeout(LP.tm);
  if(LP.el&&LP.el.classList) LP.el.classList.remove("lifting");
  document.body.classList.remove("lp-on");
  document.querySelectorAll("[data-g].over").forEach(x=>x.classList.remove("over"));
  const gh=document.getElementById("lpGhost"); if(gh&&gh.remove) gh.remove();
  LP=null;
}

/* ---- 1行ずつの検算 ----
   集計表のグロス・HDCP・ネットを3つとも入れると、グロス−HDCP＝ネット が
   成り立つかを見られる。3つのうち1つでも打ち間違えると崩れるので、
   16行すべて○になれば、そのデータは正しいと言い切れる。
   写真から読み取った文字を貼ったときも、列のずれをここで捕まえられる。 */
function scoreCheck(){
  return RUN().map(p=>{
    const s=scoreOf(p.n);
    const g=(s.gross===""||s.gross===undefined)?null:+s.gross;
    const h=(s.hc===""||s.hc===undefined)?null:+s.hc;
    const ref=(s.netRef===""||s.netRef===undefined)?null:+s.netRef;
    const calc=(g!==null&&h!==null)?Math.round((g-h)*10)/10:null;
    let st="—";                                   /* まだ入っていない */
    if(g===null||h===null) st="empty";
    else if(ref===null) st="noref";               /* 照合するネットが無い */
    else st=Math.abs(calc-ref)<0.05?"ok":"ng";
    return {n:p.n,g,hc:h,ref,calc,diff:(calc!==null&&ref!==null)?Math.round((calc-ref)*10)/10:null,st};
  });
}

function hcCalc(p){
  if(SC().system==="none") return 0;
  const s=scoreOf(p.n),hs=SC().hidden.slice(0,hiddenN());
  if(!hs.length) return null;
  let sum=0;
  for(const h of hs){const v=+s.h[h]; if(!v) return null; sum+=Math.min(v,capOf(h));}
  let hc=Math.max(0,Math.round(((sum*(SC().system==="new"?3:1.5)-coursePar())*0.8)*10)/10);
  if(hcCapped()) hc=Math.min(hc,+SC().hcMax);
  return hc;
}
